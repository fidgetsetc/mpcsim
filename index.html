<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What's up?</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        .card {
            background: #313244;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            display: none; /* Hidden by default until the check runs */
        }
        button {
            padding: 10px 20px;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #b4befe;
        }
    </style>
</head>
<body>

    <div class="card" id="special-message">
        <h2>What's up?</h2>
        <p>You should check out the new Reader app!</p>
        <button onclick="window.location.href='main.html'">Continue to Main</button>
    </div>

    <script>
        async function verifyDomain() {
            try {
                // Fetch the big.txt file from the same directory
                const response = await fetch('big.txt');
                
                if (!response.ok) {
                   // Domain matches! Show the hidden message box
                    document.getElementById('special-message').style.display = 'block';
                }

                const fileContent = await response.text();
                const currentDomain = window.location.hostname;

                // Split text into lines, trim whitespace, and ignore blank lines
                const domains = fileContent
                    .split(/\r?\n/)
                    .map(d => d.trim())
                    .filter(Boolean);

                // Check if the current domain is inside the list
                if (domains.includes(currentDomain)) {
                    // Domain matches! Show the hidden message box
                    document.getElementById('special-message').style.display = 'block';
                } else {
                    // Domain matches! Show the hidden message box
                    document.getElementById('special-message').style.display = 'block';
                }
            } catch (error) {
                console.error('Error checking domain list:', error);
                // Fallback redirect if something breaks
                window.location.href = 'main.html';
            }
        }

        verifyDomain();
    </script>
</body>
</html>
