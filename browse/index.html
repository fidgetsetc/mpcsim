<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Link Viewer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #111; font-family: system-ui, sans-serif; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; background: #111; color: #aaa; font-size: 14px; }
  button { padding: 10px 24px; font-size: 16px; border: 0; border-radius: 8px; background: #4f8cff; color: #fff; cursor: pointer; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
  #reset { padding: 6px 12px; font-size: 13px; background: #333; color: #ccc; }
</style>
</head>
<body>
  <iframe id="frame" title="Random link"></iframe>
  <div class="bar">
    <button id="btn">Random link</button>
    <span id="status"></span>
    <button id="reset" title="Forget used links and start over">Reset</button>
  </div>

<script>
  // Edit this list. Each link is used at most once (remembered across reloads).
  const links = [
    "https://edu.science.nischalchhetri.com.np/",
    "https://educational-math.lukestadem.com/",
    "https://s3.amazonaws.com/deltamath-demo/index.html",
    "https://api-www.studycare.help/",
    "https://storage.googleapis.com/grammarly/index.html",
    "https://history.worksheets.krepche.com/",
    "https://storage.googleapis.com/instructure/index.html",
    "https://study.alabasgames.com",
    "https://study.railway.web.id",
    "https://study.ryanjlowe.us",
    "https://study.tenspot.net",
    "https://studyhard.thebrittainlawfirm.com",
    "https://testingcf.jsdelivr.net/gh/dogeub/-/index.svg",
    "https://edu.ronginbari.com/",
    "https://basketball.paddletennis.biz/",
    "https://tutorlevel6.kavellewatches.com/",
    "https://edu.airgloor.ch/",
    "https://dashboard.airgloor.ch/",
    "https://s3.amazonaws.com/lsrelay-1/index.html",
    "https://lsrelay-1.s3.amazonaws.com/index.html",
    "https://dogev4-tawny.vercel.app/"
];

  const STORE_KEY = "randomLinks.state.v1";
  const frame = document.getElementById("frame");
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const resetBtn = document.getElementById("reset");

  let used = [];      // every link already shown (including the current one)
  let current = null; // link currently in the iframe

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (saved && Array.isArray(saved.used)) {
        used = saved.used;
        current = saved.current || null;
      }
    } catch (e) { /* storage unavailable or corrupt: start fresh */ }
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ used, current })); } catch (e) {}
  }

  function remaining() {
    return links.filter(l => !used.includes(l));
  }

  function updateStatus() {
    const n = remaining().length;
    btn.disabled = n === 0;
    status.textContent = n === 0 ? "No links left" : n + " link" + (n === 1 ? "" : "s") + " remaining";
  }

  function next() {
    const pool = remaining();
    if (pool.length === 0) return;
    const url = pool[Math.floor(Math.random() * pool.length)];
    used.push(url); // never used again
    current = url;
    frame.src = url;
    save();
    updateStatus();
  }

  function reset() {
    used = [];
    current = null;
    save();
    next();
  }

  btn.addEventListener("click", next);
  resetBtn.addEventListener("click", reset);

  load();
  if (current) {
    frame.src = current; // pick up where we left off
    updateStatus();
  } else {
    next();
  }
</script>
</body>
</html>
