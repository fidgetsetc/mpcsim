<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extra Wallpapers</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--th:clamp(100px,calc((100vh - 250px)/2),220px);--tw:calc(var(--th)*1.7778);--accent:#8e44ad}
html,body{height:100%;background:#1b1b1f;color:#fff;font-family:'Segoe UI','Segoe UI Light',system-ui,sans-serif;user-select:none}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:24px 48px 0;flex-shrink:0}
h1{font-size:42px;font-weight:200;letter-spacing:-1px;line-height:1}
.sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:8px;font-weight:300}
#scroller{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;gap:56px;padding:22px 48px 16px;align-items:flex-start}
#scroller::-webkit-scrollbar{height:8px}
#scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
.group{flex-shrink:0}
.group h2{font-size:15px;font-weight:300;color:rgba(255,255,255,.75);margin-bottom:12px}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,var(--th));grid-auto-columns:var(--tw);gap:6px;justify-content:start}
.t{position:relative;width:var(--tw);height:var(--th);flex:none;background-color:#000;background-size:cover;background-position:center;background-repeat:no-repeat;cursor:pointer;overflow:hidden;border:2px solid transparent;transition:transform .1s}
.t:hover{border-color:rgba(255,255,255,.55)}
.t:active{transform:scale(.97)}
.t .n{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 6px;font-size:12px;font-weight:400;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t.on{border-color:#fff}
.chips{position:absolute;top:0;right:0;display:flex;pointer-events:none}
.chips b{background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:3px 7px;letter-spacing:.5px;text-transform:uppercase}
/* import tile */
.t.add{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(255,255,255,.75);font-size:13px;font-weight:300;text-align:center;padding:0 12px}
.t.add:hover{border-color:#fff;background:rgba(255,255,255,.1);color:#fff}
.t.add .plus{font-size:44px;font-weight:200;line-height:1}
.t.add small{font-size:11px;color:rgba(255,255,255,.5)}
/* remove button on custom tiles */
.rm{position:absolute;top:0;left:0;width:26px;height:26px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:26px;cursor:pointer;opacity:0;transition:opacity .15s}
.t:hover .rm{opacity:1}
.rm:hover{background:#c0392b}
/* drag & drop overlay */
#drop{position:fixed;inset:10px;display:none;align-items:center;justify-content:center;background:rgba(142,68,173,.3);border:3px dashed #fff;font-size:28px;font-weight:200;z-index:10;pointer-events:none}
body.dragging #drop{display:flex}
footer{flex-shrink:0;height:50px;display:flex;align-items:center;gap:6px;padding:0 48px;background:#111114;border-top:1px solid rgba(255,255,255,.08)}
footer .lbl{font-size:12px;color:rgba(255,255,255,.55);margin-right:8px}
footer button{background:none;border:none;color:rgba(255,255,255,.7);font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent}
footer button:hover{color:#fff;background:rgba(255,255,255,.08)}
footer button[hidden]{display:none}
footer button.on{color:#fff;border-bottom-color:var(--accent)}
footer .sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 8px}
#msg{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);opacity:0;transition:opacity .25s}
#msg.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>extra wallpapers</h1>
  <div class="sub" id="hint">Click a tile to set it as your wallpaper. These wallpapers are here for any extra wallpapers specific to things, outside of the regular built in ones.</div>
</header>
<div id="scroller"></div>
<footer>
  <span class="lbl" id="lbl">Click sets:</span>
  <button data-m="desktop" class="on">Desktop</button>
  <button data-m="start" hidden>Start screen</button>
  <button data-m="both" hidden>Both</button>
  <span class="sep"></span>
  <button id="imp">Import image…</button>
  <span id="msg"></span>
</footer>
<div id="drop">Drop an image to use it as your wallpaper</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script>
/* ═══ EDIT THIS LIST ═══
   Every wallpaper is the same kind of entry: {name, group, url}
   url = path relative to the main index.html (e.g. './wp/mypic.jpg') or a full https:// link.
   Entries with the same group appear together. Add, remove or reorder freely. */
const WALLPAPERS=[
  {name:'(suggested) Borgack Background 1', group:'Wallpapers', url:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7DXoRm4upDOpW-uUSfxPwlxU-oppyCpruIGKo9aT9pjXrVTnuOdwfXNU&s=10'},
  {name:'(suggested) Spiderman Background 1', group:'Wallpapers', url:'https://images.hdqwalls.com/download/spiderman-power-beyond-reason-er-1366x768.jpg'},
  {name:'(suggested) Spiderman Background 2', group:'Wallpapers', url:'https://i.redd.it/d0sseo29kb8h1.png'},
  {name:'Minecraft Background 1', group:'Wallpapers', url:'https://i.redd.it/izk226szwx6g1.jpg'},
  {name:'Minecraft Background 2', group:'Wallpapers', url:'https://cdn.wallpapersafari.com/25/82/39WMB7.jpg'},
  {name:'BFDI Background 1', group:'Wallpapers', url:'https://i.pinimg.com/736x/ae/e4/0c/aee40cb185ef7ca3261e3dd92e66e54e.jpg'},
  {name:'BFDI Background 2', group:'Wallpapers', url:'./extrawp/wp/images.jpg'},
  {name:'II Background 1', group:'Wallpapers', url:'https://wallpapercave.com/wp/wp8788904.png'},
  {name:'II Background 2', group:'Wallpapers', url:'https://wallpapercave.com/wp/wp14130322.jpg'},
  {name:'Animatic Battle Background 1', group:'Wallpapers', url:'https://wallpapercave.com/wp/wp14278016.jpg'},
  {name:'Animatic Battle Background 2', group:'Wallpapers', url:'https://static.wikia.nocookie.net/bc362fc5-7502-4428-935b-d868982d9373'},
  {name:'More extra wallpapers coming soon...', group:'Wallpapers', url:'.'},
]

let mode='desktop',cur={desktop:'',start:'',startSupported:false};
const thumb=u=>u.startsWith('./')?'.'+u:u;   // this page lives one folder below index.html
const scroller=document.getElementById('scroller'),msg=document.getElementById('msg'),fileInput=document.getElementById('file');
const items=[],groups={};   // items: [{w, el, custom}]
const STORE_KEY='extrawp:custom';

function getGroup(gname){
  if(!groups[gname]){
    const g=document.createElement('div');g.className='group';
    g.innerHTML='<h2></h2><div class="grid"></div>';
    g.querySelector('h2').textContent=gname;
    scroller.appendChild(g);groups[gname]=g.querySelector('.grid');
  }
  return groups[gname];
}

function addTile(w,custom){
  const t=document.createElement('div');t.className='t';
  t.style.backgroundImage='url("'+thumb(w.url)+'")';
  t.innerHTML='<span class="n"></span><div class="chips"></div>';
  t.querySelector('.n').textContent=w.name;
  const item={w,el:t,custom:!!custom};
  if(custom){
    const x=document.createElement('button');x.className='rm';x.textContent='×';x.title='Remove';
    x.onclick=e=>{e.stopPropagation();removeItem(item)};
    t.appendChild(x);
  }
  t.onclick=e=>setWall(w,e.shiftKey&&cur.startSupported?'both':mode);
  getGroup(w.group||'Wallpapers').appendChild(t);
  items.push(item);
  return item;
}

/* ── Custom group (always first) with the import tile ── */
const customGrid=getGroup('My wallpapers');
const addTileEl=document.createElement('div');
addTileEl.className='t add';
addTileEl.innerHTML='<span class="plus">+</span><span>Import from your files</span><small>or drag &amp; drop an image anywhere</small>';
addTileEl.onclick=()=>fileInput.click();
customGrid.appendChild(addTileEl);

/* Built-in wallpapers */
WALLPAPERS.forEach(w=>addTile(w,false));

/* ── Persistence of custom wallpapers (best effort) ── */
function saveCustom(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(items.filter(x=>x.custom).map(x=>({name:x.w.name,url:x.w.url,group:'My wallpapers'}))));
    return true;
  }catch(e){return false}
}
function loadCustom(){
  try{(JSON.parse(localStorage.getItem(STORE_KEY)||'[]')||[]).forEach(w=>{if(w&&w.url)addTile({name:w.name||'Custom',group:'My wallpapers',url:w.url},true)})}catch(e){}
}
function removeItem(item){
  const i=items.indexOf(item);if(i<0)return;
  items.splice(i,1);item.el.remove();saveCustom();mark();
  toast('Removed '+item.w.name);
}

/* ── Importing ── */
function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const src=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const iw=img.naturalWidth||1920,ih=img.naturalHeight||1080;
      const s=Math.min(1,2560/Math.max(iw,ih));          // cap longest side at 2560px to keep it light
      const c=document.createElement('canvas');c.width=Math.round(iw*s);c.height=Math.round(ih*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(src);
      res(c.toDataURL('image/jpeg',.9));
    };
    img.onerror=()=>{URL.revokeObjectURL(src);rej(new Error('bad image'))};
    img.src=src;
  });
}
async function importFiles(fileList){
  const files=[...fileList].filter(f=>f.type.startsWith('image/'));
  if(!files.length){toast("That doesn't look like an image");return}
  const added=[];
  for(const f of files){
    try{
      const url=await fileToDataUrl(f);
      const name=f.name.replace(/\.[^.]+$/,'')||'Custom wallpaper';
      added.push(addTile({name,group:'My wallpapers',url},true).w);
    }catch(e){toast('Could not read '+f.name)}
  }
  if(!added.length)return;
  const saved=saveCustom();
  scroller.scrollLeft=0;
  if(added.length===1){setWall(added[0],mode)}                 // single import: apply straight away
  else toast(added.length+' wallpapers imported');
  if(!saved)setTimeout(()=>toast('Imported (too large to remember after closing)'),2300);
}
fileInput.onchange=()=>{importFiles(fileInput.files);fileInput.value=''};
document.getElementById('imp').onclick=()=>fileInput.click();

/* Drag & drop anywhere on the page */
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(hasFiles(e)){e.preventDefault();document.body.classList.add('dragging')}});
window.addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();e.dataTransfer.dropEffect='copy';document.body.classList.add('dragging')}});
window.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
window.addEventListener('drop',e=>{
  if(!hasFiles(e))return;
  e.preventDefault();document.body.classList.remove('dragging');
  importFiles(e.dataTransfer.files);
});

function setMode(m){
  mode=m;
  document.querySelectorAll('footer button[data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===m));
}
function mark(){
  const sp=!!cur.startSupported;
  document.querySelectorAll('footer button[data-m="start"],footer button[data-m="both"]').forEach(b=>b.hidden=!sp);
  if(!sp&&mode!=='desktop')setMode('desktop');
  document.getElementById('hint').textContent=sp?'Click a tile to set it. Shift+click sets Desktop & Start screen.':'Click a tile to set it as your desktop wallpaper.';
  items.forEach(({w,el})=>{
    const d=w.url===cur.desktop,s=sp&&w.url===cur.start;
    el.classList.toggle('on',d||s);
    el.querySelector('.chips').innerHTML=(d?'<b>Desktop</b>':'')+(s?'<b>Start</b>':'');
  });
}
function toast(s){msg.textContent=s;msg.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>msg.classList.remove('show'),2200)}
function setWall(w,target){
  if(window.parent===window){toast('Open this inside mpcsim to apply wallpapers');return}
  if(!cur.startSupported)target='desktop';
  parent.postMessage({type:'extrawp:set',url:w.url,target,name:w.name},'*');
  toast(w.name+' set');
}
document.querySelectorAll('footer button[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
scroller.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){scroller.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='extrawp:state'){cur=d;mark()}});

loadCustom();
if(window.parent!==window)parent.postMessage({type:'extrawp:hello'},'*');
</script>
</body>
</html>
