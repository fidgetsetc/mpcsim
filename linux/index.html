<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linux VM (v86)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* The VM screen fills the whole viewport. */
  #screen_container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #screen_container canvas {
    display: block;
    transform-origin: 0 0;
  }
  #screen_container > div {
    /* text-mode layer */
    transform-origin: 0 0;
    white-space: pre;
    font: 14px monospace;
    line-height: 16px;
    color: #aaa;
  }

  /* Boot notice */
  #notice {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: rgba(20, 20, 24, 0.92);
    color: #f2f2f2;
    border-bottom: 1px solid #444;
    font-size: 15px;
    line-height: 1.4;
  }
  #notice.hidden { display: none; }
  #notice .spinner {
    flex: none;
    width: 18px; height: 18px;
    border: 3px solid #555;
    border-top-color: #6cf;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #notice .text { flex: 1; }
  #notice strong { color: #fff; }
  #notice .timer { color: #9ab; font-variant-numeric: tabular-nums; }
  #notice button {
    flex: none;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  #notice button:hover { background: #444; }

  #error {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.9);
    color: #f88;
    padding: 24px;
    text-align: center;
    font-size: 16px;
  }
</style>
</head>
<body>

<div id="screen_container">
  <div></div>   <!-- text-mode layer -->
  <canvas></canvas>
</div>

<div id="notice">
  <div class="spinner"></div>
  <div class="text">
    <strong>Booting Linux from CD&hellip;</strong>
    This may take quite a while.
    Please be patient; the screen may stay blank or unchanged for a while.
    If it does not work, the ISO likely isn't accessible on your network.
    <span class="timer" id="timer">(0:00)</span>
  </div>
  <button id="dismiss" type="button">Hide</button>
</div>

<div id="error"></div>

<!-- v86 emulator library -->
<script src="https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ */
/* Configuration                                                       */
/* ------------------------------------------------------------------ */

// Path/URL to a bootable CD image (.iso).
const CD_IMAGE_URL = "https://shy-shape-35f8.scrappywriter.workers.dev/alpine-standard-3.24.4-x86.iso";

// true  = fetch CD sectors on demand via HTTP Range requests (server must
//         support Range; best for large images).
// false = download the entire ISO into memory before booting.
const CD_ASYNC = true;

// Optional: size of the ISO in bytes (only needed for some async setups).
// Leave null to let v86 detect it.
const CD_SIZE = null;

// Networking. v86 can't open real sockets from a browser, so it talks to a
// WebSocket relay that bridges the emulated NIC to the internet.
// Set to null to disable networking.
//   - "wss://relay.widgetry.org/" is the public relay used by v86's demos
//     (shared, best-effort). Run your own for anything serious.
const NETWORK_RELAY_URL = "wss://relay.widgetry.org/";
// "ne2k" works with practically every Linux kernel; "virtio" is faster.
const NETWORK_DEVICE_TYPE = "ne2k";

// Emulator assets
const WASM_URL      = "https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm";
// BIOS files come from the v86 GitHub repo via jsDelivr (sends CORS headers).
// copy.sh does NOT allow cross-origin requests, so don't use it here.
// For fully offline use, copy bios/seabios.bin and bios/vgabios.bin from the
// v86 repo next to this file and use "seabios.bin" / "vgabios.bin" instead.
const SEABIOS_URL   = "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin";
const VGABIOS_URL   = "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin";

// Keep RAM modest: the emulator runs on the page's main thread, and a large
// allocation makes the tab lock up when the kernel starts. 512 MB is enough
// for Debian live (standard). Try 256 MB if it still locks up.
const MEMORY_SIZE      = 512 * 1024 * 1024;  // 512 MB RAM
const VGA_MEMORY_SIZE  = 8 * 1024 * 1024;    // 8 MB video memory

/* ------------------------------------------------------------------ */
/* Emulator setup                                                      */
/* ------------------------------------------------------------------ */

const cdrom = { url: CD_IMAGE_URL, async: CD_ASYNC };
if (CD_SIZE) cdrom.size = CD_SIZE;

const options = {
  wasm_path: WASM_URL,
  memory_size: MEMORY_SIZE,
  vga_memory_size: VGA_MEMORY_SIZE,
  screen_container: document.getElementById("screen_container"),
  bios: { url: SEABIOS_URL },
  vga_bios: { url: VGABIOS_URL },
  cdrom: cdrom,
  boot_order: 0x123,   // CD first (digits read right to left: 3=CD, 2=HDD, 1=floppy)
  autostart: true,
};

if (NETWORK_RELAY_URL) {
  options.net_device = { type: NETWORK_DEVICE_TYPE, relay_url: NETWORK_RELAY_URL };
}

let emulator;
try {
  emulator = new V86(options);
} catch (e) {
  showError("Failed to start the emulator: " + e.message);
}

/* ------------------------------------------------------------------ */
/* Stretch the screen to fill the viewport                             */
/* ------------------------------------------------------------------ */

// The old code trusted the "screen-set-size" event, which in text mode can
// report character columns/rows (e.g. 80x25) instead of pixels. Scaling a
// "screen" of 80x25 up to the viewport made consoles hugely zoomed in.
// Instead, derive the natural pixel size from the canvas itself, and fall
// back to the standard VGA text-mode size (720x400).

const container = document.getElementById("screen_container");
const canvas = container.querySelector("canvas");
const TEXT_W = 720, TEXT_H = 400;

function naturalSize() {
  if (canvas && canvas.width >= 200 && canvas.height >= 100 &&
      getComputedStyle(canvas).display !== "none") {
    return [canvas.width, canvas.height];
  }
  return [TEXT_W, TEXT_H];
}

let lastKey = "";

function stretchToViewport() {
  if (!emulator) return;
  const size = naturalSize();
  const sx = window.innerWidth  / size[0];
  const sy = window.innerHeight / size[1];
  const key = sx.toFixed(4) + "x" + sy.toFixed(4);
  if (key === lastKey) return;
  lastKey = key;
  emulator.screen_set_scale(sx, sy);
}

if (emulator) {
  emulator.add_listener("screen-set-size", function () {
    // Don't trust the payload (see above); just re-measure.
    lastKey = "";
    stretchToViewport();
  });
  emulator.add_listener("emulator-ready", function () { lastKey = ""; stretchToViewport(); });
  emulator.add_listener("emulator-started", function () { lastKey = ""; stretchToViewport(); });
}
window.addEventListener("resize", function () { lastKey = ""; stretchToViewport(); });
// Cheap safety net for text<->graphics mode switches (e.g. boot menu -> console).
setInterval(stretchToViewport, 500);
stretchToViewport();

/* ------------------------------------------------------------------ */
/* Boot notice + timer                                                 */
/* ------------------------------------------------------------------ */

const notice  = document.getElementById("notice");
const timerEl = document.getElementById("timer");
const startedAt = Date.now();

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
setInterval(function () {
  timerEl.textContent = "(" + fmt(Date.now() - startedAt) + " elapsed)";
}, 1000);

// Show download progress (BIOS, CD image) so a long load isn't mistaken for a freeze.
const progressEl = document.createElement("span");
progressEl.style.cssText = "display:block;margin-top:4px;color:#9ab;font-size:13px";
notice.querySelector(".text").appendChild(progressEl);
if (emulator) {
  emulator.add_listener("download-progress", function (e) {
    const name = (e.file_name || "").split("/").pop();
    if (e.lengthComputable && e.total) {
      progressEl.textContent = "Downloading " + name + ": " +
        (e.loaded / 1048576).toFixed(0) + " / " + (e.total / 1048576).toFixed(0) + " MB";
    } else {
      progressEl.textContent = "Downloading " + name + ": " +
        (e.loaded / 1048576).toFixed(0) + " MB";
    }
  });
  emulator.add_listener("download-error", function (e) {
    showError("Failed to download " + (e.file_name || "a file") + ". See the console for details.");
  });
  emulator.add_listener("emulator-started", function () {
    progressEl.textContent = "Emulator running \u2014 waiting for the guest to boot." +
      (NETWORK_RELAY_URL ? " Networking: relay enabled." : " Networking: disabled.");
  });
}

document.getElementById("dismiss").addEventListener("click", function () {
  notice.classList.add("hidden");
});

/* ------------------------------------------------------------------ */
/* Errors                                                              */
/* ------------------------------------------------------------------ */

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = "flex";
}

window.addEventListener("error", function (e) {
  if (e && e.message && /V86|v86|wasm/i.test(e.message)) {
    showError("Emulator error: " + e.message);
  }
});
if (typeof V86 === "undefined") {
  showError("Could not load the v86 library. Check your network connection.");
}

/* Click anywhere to give the VM keyboard focus. */
document.getElementById("screen_container").addEventListener("click", function () {
  if (emulator && emulator.lock_mouse) { /* mouse capture is optional */ }
});
</script>
</body>
</html>
