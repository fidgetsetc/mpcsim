<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click the Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill; /* stretches the image to exactly fit the viewport */
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Replace the img src with your image and the href with your destination link -->
  <a href="index.html">
    <img src="transition.png" alt="Click to continue">
  </a>
</body>
</html>
