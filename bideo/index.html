<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hey how are you seeing this</title>
<style>
:root{--bg:#1d1d1d;--fg:#fff;--dim:#9a9a9a;--bar:#111}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI","Segoe UI Light","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
header{padding:48px 6vw 8px}
h1{margin:0;font-weight:200;font-size:clamp(40px,7vw,72px);letter-spacing:-1px;line-height:1}
header p{margin:8px 0 0;color:var(--dim);font-size:16px}
#grid{display:flex;flex-wrap:wrap;gap:8px;padding:28px 6vw 60px}
.tile{position:relative;width:320px;height:180px;overflow:hidden;cursor:pointer;background:#0078d7;border:0;padding:0;color:inherit;text-align:left;transition:transform .12s}
.tile:nth-child(5n+2){background:#d83b01}.tile:nth-child(5n+3){background:#00a300}
.tile:nth-child(5n+4){background:#8e24aa}.tile:nth-child(5n+5){background:#e3a21a}
.tile:hover{outline:3px solid rgba(255,255,255,.55);outline-offset:-3px}
.tile:active{transform:scale(.96)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.thumb{position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(.3333);transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .4s}
.tile.ready .thumb{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:300;padding:16px;text-align:center}
.tile.ready .state{display:none}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#player.open{display:flex}
#stage{flex:1;position:relative;min-height:0}
#box{position:absolute;left:50%;top:50%;overflow:hidden;background:#fff}
#host{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
.thumb .pptx-preview-wrapper,#host .pptx-preview-wrapper{position:static!important;height:auto!important;overflow:visible!important;background:transparent!important}
#bar{height:76px;background:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;padding-bottom:env(safe-area-inset-bottom,0)}
#title{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;align-items:center;gap:22px}
.rb{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.rb:hover{background:rgba(255,255,255,.15)}.rb:active{background:#fff;color:#000}
.rb:disabled{opacity:.3;cursor:default;background:transparent;color:#fff}
.rb:focus-visible{outline:3px solid #0078d7;outline-offset:3px}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5}
#count{min-width:84px;text-align:center;font-size:22px;font-weight:200}
#close{justify-self:end}
@media (max-width:600px){.tile{width:100%}.thumb{transform:scale(var(--s,.3333))}#title{display:none}#bar{grid-template-columns:auto 1fr}#nav{justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Bideos</h1><p>Bideos are a format that are like videos but like books, technically they are neither but have aspects from both</p></header>
<main id="grid"></main>

<div id="player" role="dialog" aria-modal="true" aria-label="Presentation player">
  <div id="stage"><div id="box"><div id="host"></div></div></div>
  <div id="bar">
    <div id="title"></div>
    <div id="nav">
      <button class="rb" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <div id="count" aria-live="polite"></div>
      <button class="rb" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <button class="rb" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptx-preview@1.0.5/dist/pptx-preview.umd.js"></script>
<script>
// ---- Edit these paths (relative to this file, or absolute URLs on the same origin) ----
const PRESENTATIONS = [
  { title: "Coming soon...",       path: "because it is still not released yet." },
];
// ---------------------------------------------------------------------------------------

const W = 960, H = 540;
const $ = id => document.getElementById(id);
const buffers = {};

async function hiddenFlags(buf) {
  const z = await JSZip.loadAsync(buf);
  const pres = await z.file("ppt/presentation.xml").async("string");
  const rels = await z.file("ppt/_rels/presentation.xml.rels").async("string");
  const map = {};
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
    const id = /\bId="([^"]+)"/.exec(m[0]), tg = /\bTarget="([^"]+)"/.exec(m[0]);
    if (id && tg) map[id[1]] = tg[1];
  }
  const flags = [];
  for (const m of pres.matchAll(/<p:sldId\b[^>]*\br:id="([^"]+)"/g)) {
    const t = (map[m[1]] || "").replace(/^\/?(ppt\/)?/, "");
    const f = t && z.file("ppt/" + t);
    const xml = f ? await f.async("string") : "";
    flags.push(/<p:sld\b[^>]*\sshow="(0|false)"/.test(xml));
  }
  return flags;
}

// Renders every slide into host, hides them all, returns slide elements and the indexes of unhidden ones.
async function render(host, buf) {
  host.innerHTML = "";
  const pv = pptxPreview.init(host, { width: W, height: H, mode: "list" });
  await pv.preview(buf.slice(0));
  let els = [...host.querySelectorAll(".pptx-preview-slide-wrapper")];
  if (!els.length) { const w = host.querySelector(".pptx-preview-wrapper"); els = w ? [...w.children] : []; }
  let flags = [];
  try { flags = await hiddenFlags(buf); } catch (e) {}
  const useFlags = flags.length === els.length;
  let idx = els.map((_, i) => i).filter(i => !(useFlags && flags[i]));
  if (!idx.length) idx = els.map((_, i) => i);
  els.forEach(e => { e.style.display = "none"; e.style.margin = "0"; });
  return { els, idx };
}

async function getBuffer(p) {
  if (!buffers[p.path]) {
    const r = await fetch(p.path);
    if (!r.ok) throw new Error("HTTP " + r.status);
    buffers[p.path] = await r.arrayBuffer();
  }
  return buffers[p.path];
}

// ---- Library grid ----
const grid = $("grid");
const tiles = PRESENTATIONS.map((p, i) => {
  const t = document.createElement("button");
  t.className = "tile";
  t.setAttribute("aria-label", "Play " + p.title);
  t.innerHTML = '<div class="thumb"></div><div class="state">loading…</div><div class="cap"></div>';
  t.querySelector(".cap").textContent = p.title;
  t.onclick = () => openPlayer(i);
  grid.appendChild(t);
  return t;
});

function fitThumbs() {
  tiles.forEach(t => t.querySelector(".thumb").style.setProperty("--s", t.clientWidth / W));
}
if (matchMedia("(max-width:600px)").matches) addEventListener("resize", fitThumbs);

(async () => {
  for (let i = 0; i < PRESENTATIONS.length; i++) {
    const t = tiles[i], thumb = t.querySelector(".thumb");
    try {
      const { els, idx } = await render(thumb, await getBuffer(PRESENTATIONS[i]));
      els[idx[0]].style.display = "block";
      t.classList.add("ready");
    } catch (e) {
      t.querySelector(".state").textContent = "Can't load " + PRESENTATIONS[i].path +
        (location.protocol === "file:" ? " (serve this page over http)" : " (" + e.message + ")");
    }
  }
  fitThumbs();
})();

// ---- Player ----
let cur = null, pos = 0;

function fit() {
  const s = $("stage"), w = s.clientWidth, h = s.clientHeight;
  const k = Math.min(w / W, h / H);
  const box = $("box");
  box.style.width = W * k + "px"; box.style.height = H * k + "px";
  box.style.marginLeft = -(W * k) / 2 + "px"; box.style.marginTop = -(H * k) / 2 + "px";
  $("host").style.transform = "scale(" + k + ")";
}

function show(n) {
  if (!cur) return;
  pos = Math.max(0, Math.min(cur.idx.length - 1, n));
  cur.els.forEach(e => e.style.display = "none");
  cur.els[cur.idx[pos]].style.display = "block";
  $("count").textContent = (pos + 1) + " / " + cur.idx.length;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === cur.idx.length - 1;
}

async function openPlayer(i) {
  const p = PRESENTATIONS[i];
  $("title").textContent = p.title;
  $("count").textContent = "…";
  $("player").classList.add("open");
  document.body.style.overflow = "hidden";
  fit();
  try {
    cur = await render($("host"), await getBuffer(p));
    show(0);
  } catch (e) {
    $("count").textContent = "Error";
  }
  $("next").focus();
}

function closePlayer() {
  $("player").classList.remove("open");
  document.body.style.overflow = "";
  $("host").innerHTML = "";
  cur = null;
}

$("prev").onclick = () => show(pos - 1);
$("next").onclick = () => show(pos + 1);
$("close").onclick = closePlayer;
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (!$("player").classList.contains("open")) return;
  if (e.key === "ArrowLeft" || e.key === "PageUp") show(pos - 1);
  else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(pos + 1); }
  else if (e.key === "Escape") closePlayer();
});
</script>
</body>
</html>
