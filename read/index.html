<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hey how are you seeing this</title>
<style>
:root{--bg:#1d1d1d;--fg:#fff;--dim:#9a9a9a;--bar:#111}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI","Segoe UI Light","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
header{padding:48px 6vw 8px}
h1{margin:0;font-weight:200;font-size:clamp(40px,7vw,72px);letter-spacing:-1px;line-height:1}
header p{margin:8px 0 0;color:var(--dim);font-size:16px}
#grid{display:flex;flex-wrap:wrap;gap:8px;padding:28px 6vw 60px}
.tile{position:relative;width:320px;height:180px;overflow:hidden;cursor:pointer;background:#0078d7;border:0;padding:0;color:inherit;text-align:left;transition:transform .12s}
.tile:nth-child(5n+2){background:#d83b01}.tile:nth-child(5n+3){background:#00a300}
.tile:nth-child(5n+4){background:#8e24aa}.tile:nth-child(5n+5){background:#e3a21a}
.tile:hover{outline:3px solid rgba(255,255,255,.55);outline-offset:-3px}
.tile:active{transform:scale(.96)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.thumb{position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(.3333);transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .4s}
.tile.ready .thumb{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:300;padding:16px;text-align:center}
.tile.ready .state{display:none}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#player.open{display:flex}
#stage{flex:1;position:relative;min-height:0}
#box{position:absolute;left:50%;top:50%;overflow:hidden;background:#fff}
#host{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
.thumb .pptx-preview-wrapper,#host .pptx-preview-wrapper{position:static!important;height:auto!important;overflow:visible!important;background:transparent!important}
#bar{height:76px;background:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;padding-bottom:env(safe-area-inset-bottom,0)}
#title{font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;align-items:center;gap:22px}
.rb{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.rb:hover{background:rgba(255,255,255,.15)}.rb:active{background:#fff;color:#000}
.rb:disabled{opacity:.3;cursor:default;background:transparent;color:#fff}
.rb:focus-visible{outline:3px solid #0078d7;outline-offset:3px}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5}
#count{min-width:84px;text-align:center;font-size:22px;font-weight:200}
#tools{justify-self:end;display:flex;align-items:center;gap:12px}
#voice{height:36px;padding:0 8px;background:#222;color:#fff;border:1px solid #666;font:inherit;font-size:14px;max-width:110px}
#voice:focus-visible{outline:3px solid #0078d7;outline-offset:2px}
#tts[aria-pressed="true"]{background:#0078d7;border-color:#0078d7}
#tts .slash{display:none}
#tts[aria-pressed="false"] .slash{display:block}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);max-width:90%;background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;font-size:14px;display:none;z-index:2;pointer-events:none;text-align:center}
#toast.show{display:block}
#toast.err{background:#a4262c}
@media (max-width:600px){.tile{width:100%}.thumb{transform:scale(var(--s,.3333))}#title{display:none}#bar{grid-template-columns:auto 1fr;padding:0 12px}#nav{justify-self:start;gap:12px}#count{min-width:64px;font-size:18px}#voice{max-width:70px}#tools{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Reader</h1><p>Read books, I guess. I might include some of my own work here. (powered by PPTX files!)</p></header>
<main id="grid"></main>

<div id="player" role="dialog" aria-modal="true" aria-label="Presentation player">
  <div id="stage"><div id="box"><div id="host"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="bar">
    <div id="title"></div>
    <div id="nav">
      <button class="rb" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <div id="count" aria-live="polite"></div>
      <button class="rb" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <div id="tools">
      <select id="voice" aria-label="Text to speech voice" title="Text to speech voice">
        <option value="slt">slt</option>
        <option value="kal">kal</option>
        <option value="awb">awb</option>
        <option value="rms">rms</option>
        <option value="kal16">kal16</option>
      </select>
      <button class="rb" id="tts" aria-pressed="false" aria-label="Read slide notes aloud" title="Read slide notes aloud"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path class="slash" d="M3 3l18 18"/></svg></button>
      <button class="rb" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptx-preview@1.0.5/dist/pptx-preview.umd.js"></script>
<script>
// ---- Edit these paths (relative to this file, or absolute URLs on the same origin) ----
const PRESENTATIONS = [
  { title: "Diary of a Wimpy Kid",       path: "./books/Diary of a wimpy kid book01_text.pptx" },
  { title: "We're all objects in this world...and I'm the only one who isn't dumb.",       path: "./books/object.pptx" },
];
// Text to speech (flite compiled to WASI). See ../tts/tts.js
const FLITE_WASM = "../tts/flite.wasm";
const WASI_SHIM  = "https://cdn.jsdelivr.net/npm/@bjorn3/browser_wasi_shim@0.3.0/dist/index.js";
// ---------------------------------------------------------------------------------------

const W = 960, H = 540;
const $ = id => document.getElementById(id);
const buffers = {};

// ---- PPTX parsing helpers ----
const decodeXml = s => s
  .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n))
  .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
  .replace(/&amp;/g, "&");

function resolvePath(baseDir, target) {
  if (target.startsWith("/")) return target.slice(1);
  const parts = baseDir.split("/").filter(Boolean);
  for (const seg of target.split("/")) {
    if (seg === "..") parts.pop();
    else if (seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}

// Pulls the speaker-note text out of a notesSlide XML (body placeholder only, so the
// slide image / slide number placeholders are ignored).
function notesText(xml) {
  const out = [];
  for (const sp of xml.match(/<p:sp\b[\s\S]*?<\/p:sp>/g) || []) {
    const ph = /<p:ph\b[^>]*>/.exec(sp);
    if (!ph || !/\btype="body"/.test(ph[0])) continue;
    for (const p of sp.match(/<a:p\b[\s\S]*?<\/a:p>/g) || []) {
      const t = [...p.matchAll(/<a:t\b[^>]*>([\s\S]*?)<\/a:t>/g)].map(m => decodeXml(m[1])).join("");
      if (t.trim()) out.push(t.trim());
    }
  }
  return out.join("\n");
}

// Returns, in presentation order, whether each slide is hidden and its speaker notes.
async function readDeck(buf) {
  const z = await JSZip.loadAsync(buf);
  const pres = await z.file("ppt/presentation.xml").async("string");
  const rels = await z.file("ppt/_rels/presentation.xml.rels").async("string");
  const map = {};
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
    const id = /\bId="([^"]+)"/.exec(m[0]), tg = /\bTarget="([^"]+)"/.exec(m[0]);
    if (id && tg) map[id[1]] = tg[1];
  }
  const flags = [], notes = [];
  for (const m of pres.matchAll(/<p:sldId\b[^>]*\br:id="([^"]+)"/g)) {
    const t = (map[m[1]] || "").replace(/^\/?(ppt\/)?/, "");
    const path = "ppt/" + t;
    const f = t && z.file(path);
    const xml = f ? await f.async("string") : "";
    flags.push(/<p:sld\b[^>]*\sshow="(0|false)"/.test(xml));

    let note = "";
    try {
      const rf = t && z.file(path.replace(/([^/]+)$/, "_rels/$1.rels"));
      if (rf) {
        const rx = await rf.async("string");
        for (const r of rx.matchAll(/<Relationship\b[^>]*>/g)) {
          if (!/\/notesSlide"/.test(r[0])) continue;
          const tg = /\bTarget="([^"]+)"/.exec(r[0]);
          const nf = tg && z.file(resolvePath(path.replace(/[^/]+$/, ""), tg[1]));
          if (nf) note = notesText(await nf.async("string"));
          break;
        }
      }
    } catch (e) {}
    notes.push(note);
  }
  return { flags, notes };
}

// Renders every slide into host, hides them all, returns slide elements, the indexes of unhidden ones,
// and the speaker notes (indexed like els).
async function render(host, buf) {
  host.innerHTML = "";
  const pv = pptxPreview.init(host, { width: W, height: H, mode: "list" });
  await pv.preview(buf.slice(0));
  let els = [...host.querySelectorAll(".pptx-preview-slide-wrapper")];
  if (!els.length) { const w = host.querySelector(".pptx-preview-wrapper"); els = w ? [...w.children] : []; }
  let flags = [], notes = [];
  try { ({ flags, notes } = await readDeck(buf)); } catch (e) {}
  const aligned = flags.length === els.length;
  let idx = els.map((_, i) => i).filter(i => !(aligned && flags[i]));
  if (!idx.length) idx = els.map((_, i) => i);
  els.forEach(e => { e.style.display = "none"; e.style.margin = "0"; });
  return { els, idx, notes: aligned ? notes : [] };
}

async function getBuffer(p) {
  if (!buffers[p.path]) {
    const r = await fetch(p.path);
    if (!r.ok) throw new Error("HTTP " + r.status);
    buffers[p.path] = await r.arrayBuffer();
  }
  return buffers[p.path];
}

// ---- Text to speech (flite.wasm via a browser WASI shim) ----
let toastTimer = 0;
function setToast(msg, isErr) {
  const t = $("toast");
  clearTimeout(toastTimer);
  t.textContent = msg || "";
  t.classList.toggle("show", !!msg);
  t.classList.toggle("err", !!isErr);
}
function flash(msg, ms = 2500) {
  setToast(msg);
  toastTimer = setTimeout(() => setToast(""), ms);
}

let fliteP = null;
function loadFlite() {
  if (!fliteP) {
    fliteP = (async () => {
      setToast("Loading voice (first time only)…");
      const [shim, res] = await Promise.all([import(WASI_SHIM), fetch(FLITE_WASM)]);
      if (!res.ok) throw new Error("flite.wasm not found at " + FLITE_WASM);
      const mod = await WebAssembly.compile(await res.arrayBuffer());
      return { shim, mod };
    })();
    fliteP.catch(() => { fliteP = null; });
  }
  return fliteP;
}

const wavCache = new Map(); // "voice|text" -> blob URL
async function synth(text, voice) {
  const key = voice + "|" + text;
  if (wavCache.has(key)) return wavCache.get(key);
  const { shim, mod } = await loadFlite();
  const { WASI, File, OpenFile, PreopenDirectory } = shim;

  const outFile = new File(new Uint8Array(0));
  const root = new PreopenDirectory(".", new Map([["out.wav", outFile]]));
  const fds = [
    new OpenFile(new File(new Uint8Array(0))), // stdin
    new OpenFile(new File(new Uint8Array(0))), // stdout
    new OpenFile(new File(new Uint8Array(0))), // stderr
    root,                                       // fd 3, preopened "."
  ];
  const wasi = new WASI(["flite", "-voice", voice, text, "out.wav"], [], fds);
  const instance = await WebAssembly.instantiate(mod, { wasi_snapshot_preview1: wasi.wasiImport });
  try { wasi.start(instance); }
  catch (e) { if (!(e && e.message === "exit")) throw e; }

  const wav = outFile.data;
  if (!wav || !wav.length) throw new Error("Flite produced no audio");
  const url = URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
  wavCache.set(key, url);
  if (wavCache.size > 60) {
    const [oldKey, oldUrl] = wavCache.entries().next().value;
    wavCache.delete(oldKey);
    URL.revokeObjectURL(oldUrl);
  }
  return url;
}

// Split notes into sentence-sized chunks so speech starts quickly on long notes.
function chunkText(text, max = 280) {
  const flat = text.replace(/([.!?:;])?\s*\n+\s*/g, (m, p) => (p || ".") + " ");
  const sentences = flat.match(/[^.!?]+[.!?]*\s*/g) || [flat];
  const chunks = [];
  let cur = "";
  for (const s of sentences) {
    if (cur && (cur + s).length > max) { chunks.push(cur); cur = ""; }
    cur += s;
  }
  if (cur.trim()) chunks.push(cur);
  // flite's CLI would read a leading "-" as an option, so strip it
  return chunks.map(c => c.trim().replace(/^[-\s]+/, "")).filter(Boolean);
}

const audio = new Audio();
let speechToken = 0, ttsOn = false;

function stopSpeech() {
  speechToken++;
  audio.onended = audio.onerror = null;
  audio.pause();
  setToast("");
}

function playUrl(url) {
  return new Promise((resolve, reject) => {
    audio.onended = resolve;
    audio.onerror = () => reject(new Error("Playback failed"));
    audio.src = url;
    audio.play().catch(reject);
  });
}

async function speak(text) {
  stopSpeech();
  const my = speechToken;
  if (!text) { flash("No notes on this slide"); return; }
  const voice = $("voice").value;
  const parts = chunkText(text);
  if (!parts.length) { flash("No notes on this slide"); return; }
  try {
    let next = synth(parts[0], voice);
    next.catch(() => {});
    setToast("Preparing speech…");
    for (let i = 0; i < parts.length; i++) {
      const url = await next;
      if (my !== speechToken) return;
      if (i + 1 < parts.length) { next = synth(parts[i + 1], voice); next.catch(() => {}); }
      setToast("Reading notes…");
      await playUrl(url);
      if (my !== speechToken) return;
    }
    setToast("");
  } catch (e) {
    console.error(e);
    if (my === speechToken) setToast("Speech error: " + e.message, true);
  }
}

function currentNotes() {
  return cur && cur.notes ? (cur.notes[cur.idx[pos]] || "") : "";
}

function saveTts() {
  try { localStorage.setItem("bideos.tts", ttsOn ? "1" : "0"); localStorage.setItem("bideos.voice", $("voice").value); } catch (e) {}
}
function syncTtsButton() { $("tts").setAttribute("aria-pressed", ttsOn ? "true" : "false"); }

try {
  ttsOn = localStorage.getItem("bideos.tts") === "1";
  const v = localStorage.getItem("bideos.voice");
  if (v && [...$("voice").options].some(o => o.value === v)) $("voice").value = v;
} catch (e) {}
syncTtsButton();

$("tts").onclick = () => {
  ttsOn = !ttsOn;
  syncTtsButton();
  saveTts();
  if (ttsOn) speak(currentNotes()); else stopSpeech();
};
$("voice").onchange = () => {
  saveTts();
  $("voice").blur();
  if (ttsOn) speak(currentNotes());
};

// ---- Library grid ----
const grid = $("grid");
const tiles = PRESENTATIONS.map((p, i) => {
  const t = document.createElement("button");
  t.className = "tile";
  t.setAttribute("aria-label", "Play " + p.title);
  t.innerHTML = '<div class="thumb"></div><div class="state">loading…</div><div class="cap"></div>';
  t.querySelector(".cap").textContent = p.title;
  t.onclick = () => openPlayer(i);
  grid.appendChild(t);
  return t;
});

function fitThumbs() {
  tiles.forEach(t => t.querySelector(".thumb").style.setProperty("--s", t.clientWidth / W));
}
if (matchMedia("(max-width:600px)").matches) addEventListener("resize", fitThumbs);

(async () => {
  for (let i = 0; i < PRESENTATIONS.length; i++) {
    const t = tiles[i], thumb = t.querySelector(".thumb");
    try {
      const { els, idx } = await render(thumb, await getBuffer(PRESENTATIONS[i]));
      els[idx[0]].style.display = "block";
      t.classList.add("ready");
    } catch (e) {
      t.querySelector(".state").textContent = "Can't load " + PRESENTATIONS[i].path +
        (location.protocol === "file:" ? " (serve this page over http)" : " (" + e.message + ")");
    }
  }
  fitThumbs();
})();

// ---- Player ----
let cur = null, pos = 0;

function fit() {
  const s = $("stage"), w = s.clientWidth, h = s.clientHeight;
  const k = Math.min(w / W, h / H);
  const box = $("box");
  box.style.width = W * k + "px"; box.style.height = H * k + "px";
  box.style.marginLeft = -(W * k) / 2 + "px"; box.style.marginTop = -(H * k) / 2 + "px";
  $("host").style.transform = "scale(" + k + ")";
}

function show(n) {
  if (!cur) return;
  pos = Math.max(0, Math.min(cur.idx.length - 1, n));
  cur.els.forEach(e => e.style.display = "none");
  cur.els[cur.idx[pos]].style.display = "block";
  $("count").textContent = (pos + 1) + " / " + cur.idx.length;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === cur.idx.length - 1;
  if (ttsOn) speak(currentNotes()); else stopSpeech();
}

async function openPlayer(i) {
  const p = PRESENTATIONS[i];
  $("title").textContent = p.title;
  $("count").textContent = "…";
  $("player").classList.add("open");
  document.body.style.overflow = "hidden";
  fit();
  try {
    cur = await render($("host"), await getBuffer(p));
    show(0);
  } catch (e) {
    $("count").textContent = "Error";
  }
  $("next").focus();
}

function closePlayer() {
  stopSpeech();
  $("player").classList.remove("open");
  document.body.style.overflow = "";
  $("host").innerHTML = "";
  cur = null;
}

$("prev").onclick = () => show(pos - 1);
$("next").onclick = () => show(pos + 1);
$("close").onclick = closePlayer;
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (!$("player").classList.contains("open")) return;
  if (e.target && e.target.tagName === "SELECT") { if (e.key === "Escape") closePlayer(); return; }
  if (e.key === "ArrowLeft" || e.key === "PageUp") show(pos - 1);
  else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(pos + 1); }
  else if (e.key === "Escape") closePlayer();
});
</script>
</body>
</html>
