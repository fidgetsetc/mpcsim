<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Loader</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #bar { width: min(420px, 80vw); height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #4ade80; transition: width .1s; }
  #status { font-size: 14px; opacity: .8; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
</style>
</head>
<body>
<div id="loader">
  <div id="status">Starting…</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>

<script>
(async () => {
  const URL_ = "https://sweet-credit-2ac4.scrappywriter.workers.dev/game.html";
  const CONNECTIONS = 8;                 // parallel range requests
  const MIN_CHUNK = 256 * 1024;          // don't split into pieces smaller than this
  const statusEl = document.getElementById("status");
  const fill = document.getElementById("fill");
  const frame = document.getElementById("frame");

  const setStatus = (t) => (statusEl.textContent = t);
  const fmt = (n) => (n / 1048576).toFixed(2) + " MB";

  // Probe size + range support with a 1-byte ranged GET (more reliable than HEAD through redirects).
  async function probe() {
    try {
      const r = await fetch(URL_, { headers: { Range: "bytes=0-0" } });
      if (r.status === 206) {
        const m = /\/(\d+)\s*$/.exec(r.headers.get("Content-Range") || "");
        if (m) return { total: +m[1], ranges: true };
      }
      const len = +r.headers.get("Content-Length");
      return { total: len || 0, ranges: false };
    } catch (e) {
      return { total: 0, ranges: false };
    }
  }

  async function fetchParallel(total) {
    const n = Math.max(1, Math.min(CONNECTIONS, Math.ceil(total / MIN_CHUNK)));
    const size = Math.ceil(total / n);
    const parts = new Array(n);
    const loaded = new Array(n).fill(0);
    const update = () => {
      const sum = loaded.reduce((a, b) => a + b, 0);
      fill.style.width = (sum / total * 100).toFixed(1) + "%";
      setStatus(`Downloading ${fmt(sum)} / ${fmt(total)} (${n} connections)`);
    };

    await Promise.all(Array.from({ length: n }, async (_, i) => {
      const start = i * size;
      const end = Math.min(total - 1, start + size - 1);
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const r = await fetch(URL_, { headers: { Range: `bytes=${start}-${end}` } });
          if (r.status !== 206) throw new Error("Range not honored (" + r.status + ")");
          const reader = r.body.getReader();
          const chunks = [];
          loaded[i] = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded[i] += value.length;
            update();
          }
          parts[i] = new Blob(chunks);
          return;
        } catch (e) {
          if (attempt === 2) throw e;
        }
      }
    }));
    return new Blob(parts);
  }

  async function fetchSingle() {
    setStatus("Downloading…");
    const r = await fetch(URL_);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const total = +r.headers.get("Content-Length") || 0;
    const reader = r.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      if (total) fill.style.width = (got / total * 100).toFixed(1) + "%";
      setStatus(`Downloading ${fmt(got)}${total ? " / " + fmt(total) : ""}`);
    }
    return new Blob(chunks);
  }

  try {
    setStatus("Checking file…");
    const { total, ranges } = await probe();

    let data;
    if (ranges && total > 0) {
      try { data = await fetchParallel(total); }
      catch (e) { console.warn("Parallel failed, falling back:", e); data = await fetchSingle(); }
    } else {
      data = await fetchSingle();
    }

    const blob = new Blob([data], { type: "text/html" });
    const blobUrl = URL.createObjectURL(blob);

    frame.src = blobUrl;
    frame.onload = () => {
      document.getElementById("loader").style.display = "none";
      frame.style.display = "block";
    };
  } catch (err) {
    console.error(err);
    setStatus("Failed to load: " + err.message);
    fill.style.background = "#f87171";
    fill.style.width = "100%";
  }
})();
</script>
</body>
</html>
