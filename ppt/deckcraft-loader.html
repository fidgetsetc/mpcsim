<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckCraft Loader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #status { position: fixed; inset: auto 0 0 0; padding: 8px 14px; font-size: 13px; white-space: pre-wrap;
            background: #000c; color: #fff; z-index: 10; transition: opacity .4s; }
  #status.hide { opacity: 0; pointer-events: none; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<input id="repo" type="hidden" value="storytold/deckcraft">
<input id="version" type="hidden" value="">
<div id="status">Starting…</div>
<iframe id="frame" allow="fullscreen"></iframe>

<script>
const $ = id => document.getElementById(id);
const status = m => { $('status').textContent = m; console.log(m); };

const MIME = {
  html:'text/html', css:'text/css', js:'text/javascript', mjs:'text/javascript', json:'application/json',
  svg:'image/svg+xml', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
  webp:'image/webp', ico:'image/x-icon', woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf',
  otf:'font/otf', wasm:'application/wasm', txt:'text/plain', map:'application/json',
  mp3:'audio/mpeg', mp4:'video/mp4', webm:'video/webm', ogg:'audio/ogg'
};
const ext = p => (p.split('.').pop() || '').toLowerCase();
const TEXT = new Set(['html','css','js','mjs','json','svg','txt','map']);

/* ---------- GitHub API ---------- */
async function getRelease(repo, version) {
  const api = `https://api.github.com/repos/${repo}/releases`;
  if (!version) {
    const r = await fetch(`${api}/latest`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(`GitHub API ${r.status} (latest release)`);
    return r.json();
  }
  for (const tag of [version, `v${version}`, version.replace(/^v/, ''), `v${version.replace(/^v/, '')}`]) {
    const r = await fetch(`${api}/tags/${encodeURIComponent(tag)}`, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.ok) return r.json();
  }
  throw new Error(`No release found for version "${version}"`);
}

function pickAsset(release, version) {
  const v = (version || release.tag_name).replace(/^v/, '');
  const exact = `deckcraft-web-${v}.zip`;
  return release.assets.find(a => a.name === exact)
      || release.assets.find(a => /^deckcraft-web-.*\.zip$/.test(a.name))
      || null;
}

/* ---------- Download with fallbacks ---------- */
async function download(repo, release, asset, version) {
  const tag = release.tag_name;
  const name = asset ? asset.name : `deckcraft-web-${(version || tag).replace(/^v/, '')}.zip`;
  const direct = `https://github.com/${repo}/releases/download/${tag}/${name}`;

  const attempts = [];
  if (asset) {
    attempts.push(['GitHub API asset', asset.url, { headers: { Accept: 'application/octet-stream' } }]);
    attempts.push(['browser_download_url', asset.browser_download_url, {}]);
  }
  attempts.push(['direct release URL', direct, {}]);
  // Public CORS proxies / mirrors (fallbacks; availability varies)
  attempts.push(['corsproxy.io', `https://corsproxy.io/?url=${encodeURIComponent(direct)}`, {}]);
  attempts.push(['allorigins', `https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}`, {}]);
  attempts.push(['ghfast mirror', `https://ghfast.top/${direct}`, {}]);

  const errors = [];
  for (const [label, url, opts] of attempts) {
    try {
      status(`Downloading via ${label}…`);
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const buf = await r.arrayBuffer();
      if (buf.byteLength < 100) throw new Error('empty response');
      return buf;
    } catch (e) { errors.push(`${label}: ${e.message}`); }
  }
  throw new Error('All download routes failed:\n' + errors.join('\n'));
}

/* ---------- Unzip + blob: rewriting ---------- */
const norm = p => { const out = []; for (const s of p.split('/')) { if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); } return out.join('/'); };
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';

async function buildBlobs(buf) {
  const zip = await JSZip.loadAsync(buf);
  let names = Object.keys(zip.files).filter(n => !zip.files[n].dir && !n.startsWith('__MACOSX/'));

  // strip a single common root folder
  const roots = new Set(names.map(n => n.split('/')[0]));
  if (roots.size === 1 && names.every(n => n.includes('/'))) {
    const root = [...roots][0] + '/';
    names = names.map(n => n);
    var strip = root;
  }
  const clean = n => (typeof strip !== 'undefined' && n.startsWith(strip)) ? n.slice(strip.length) : n;

  const files = {};   // path -> { raw: Uint8Array|string, url?: string }
  for (const n of names) {
    const p = clean(n), e = ext(p);
    files[p] = TEXT.has(e) ? { text: await zip.files[n].async('string') }
                           : { bytes: await zip.files[n].async('uint8array') };
  }
  status(`Unpacked ${Object.keys(files).length} files.`);

  const mk = (p, data) => URL.createObjectURL(new Blob([data], { type: MIME[ext(p)] || 'application/octet-stream' }));

  // 1) binary assets
  for (const [p, f] of Object.entries(files)) if (f.bytes) f.url = mk(p, f.bytes);

  // resolve a reference string relative to a file
  const resolve = (from, ref) => {
    if (/^(data:|blob:|https?:|\/\/|#|mailto:)/i.test(ref)) return null;
    const clean = ref.split('#')[0].split('?')[0];
    if (!clean) return null;
    const target = clean.startsWith('/') ? norm(clean) : norm(dirOf(from) + '/' + clean);
    return files[target] ? target : null;
  };

  // 2) text files in dependency order (CSS/JS/SVG), cycles fall back to unrewritten refs
  const state = {};
  const process = p => {
    if (state[p] === 'done' || state[p] === 'busy') return;
    state[p] = 'busy';
    const f = files[p], e = ext(p);
    let t = f.text;
    const sub = ref => {
      const tp = resolve(p, ref);
      if (!tp) return null;
      if (files[tp].text !== undefined && ext(tp) !== 'html') process(tp);
      return files[tp].url || null;
    };
    if (e === 'css') {
      t = t.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, ref) => { const u = sub(ref); return u ? `url(${q}${u}${q})` : m; });
      t = t.replace(/@import\s+(['"])([^'"]+)\1/g, (m, q, ref) => { const u = sub(ref); return u ? `@import ${q}${u}${q}` : m; });
    } else if (e === 'js' || e === 'mjs') {
      // relative string literals that point at a file in the bundle
      t = t.replace(/(['"`])((?:\.{0,2}\/)?[\w@./-]+\.[a-z0-9]{2,5})\1/gi, (m, q, ref) => {
        if (!/^(\.{1,2}\/|\/)/.test(ref) && !ref.includes('/')) return m;
        const u = sub(ref); return u ? `${q}${u}${q}` : m;
      });
    } else if (e === 'svg') {
      t = t.replace(/(href|src)=(["'])([^"']+)\2/g, (m, a, q, ref) => { const u = sub(ref); return u ? `${a}=${q}${u}${q}` : m; });
    }
    if (e !== 'html') f.url = mk(p, t);
    state[p] = 'done';
  };
  for (const p of Object.keys(files)) if (files[p].text !== undefined && ext(p) !== 'html') process(p);

  // 3) HTML pages
  for (const [p, f] of Object.entries(files)) {
    if (ext(p) !== 'html') continue;
    const doc = new DOMParser().parseFromString(f.text, 'text/html');
    doc.querySelectorAll('[src],[href],[poster],[data-src]').forEach(el => {
      for (const a of ['src', 'href', 'poster', 'data-src']) {
        const ref = el.getAttribute(a); if (!ref) continue;
        const tp = resolve(p, ref);
        if (tp && files[tp].url && !(el.tagName === 'A')) el.setAttribute(a, files[tp].url);
      }
    });
    doc.querySelectorAll('[style]').forEach(el => {
      el.setAttribute('style', el.getAttribute('style').replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, ref) => {
        const tp = resolve(p, ref); return tp && files[tp].url ? `url(${q}${files[tp].url}${q})` : m;
      }));
    });
    doc.querySelectorAll('style').forEach(s => {
      s.textContent = s.textContent.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, ref) => {
        const tp = resolve(p, ref); return tp && files[tp].url ? `url(${q}${files[tp].url}${q})` : m;
      });
    });
    // remove integrity/crossorigin attrs that break on blob: URLs
    doc.querySelectorAll('[integrity]').forEach(el => el.removeAttribute('integrity'));
    f.url = mk(p, '<!doctype html>\n' + doc.documentElement.outerHTML);
  }
  return files;
}

/* ---------- Main ---------- */
async function load() {
  try {
    const repo = $('repo').value.trim();
    const version = $('version').value.trim().replace(/^v/, '');
    status('Querying GitHub API…');
    const release = await getRelease(repo, version);
    const asset = pickAsset(release, version);
    const buf = await download(repo, release, asset, version);
    const files = await buildBlobs(buf);
    // Entry priority: shallowest index.html (root first), then any index.*.html, then shallowest other HTML
    const htmls = Object.keys(files).filter(p => ext(p) === 'html')
      .sort((a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b));
    const base = p => p.split('/').pop().toLowerCase();
    const entry = htmls.find(p => base(p) === 'index.html')
      || htmls.find(p => base(p).startsWith('index'))
      || htmls[0];
    if (!entry) throw new Error('No HTML file found in the zip.');
    window.deckcraftFiles = files;           // inspect in devtools
    $('frame').src = files[entry].url;
    status(`Loaded ${release.tag_name} → ${entry}`);
    setTimeout(() => $('status').classList.add('hide'), 800);
  } catch (e) {
    status('Error: ' + e.message);
  }
}
load();
</script>
</body>
</html>
