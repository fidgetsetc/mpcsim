<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scratchget</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://trampoline.turbowarp.org" crossorigin>
<link rel="preconnect" href="https://projects.scratch.mit.edu" crossorigin>
<link rel="preconnect" href="https://assets.scratch.mit.edu" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  #stage-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  #overlay input {
    padding: 10px;
    width: 260px;
    border-radius: 4px;
    border: none;
    font-size: 15px;
  }
  #overlay button {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    background: #ffbf00;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }
  #overlay button:hover { background: #e6ac00; }
  #statusMsg { font-size: 14px; color: #aaa; min-height: 18px; }
  #overlay.loading-only #inputRow,
  #overlay.loading-only h2 { display: none !important; }
  #overlay.loading-only #statusMsg {
    font-size: 18px;
    color: #fff;
  }
  .spinner {
    display: none;
    width: 36px;
    height: 36px;
    border: 4px solid #444;
    border-top-color: #ffbf00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  #overlay.loading-only .spinner { display: block; }
  #overlay.asking .spinner { display: none; }
  #usernameRow {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #overlay.asking #usernameRow { display: flex; }
  #usernameHint { font-size: 13px; color: #aaa; max-width: 280px; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="overlay">
  <div id="inputRow" style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <input type="text" id="projectIdInput" placeholder="Enter Scratch project ID">
    <button onclick="startFromInput()">Load Project</button>
  </div>
  <div id="usernameRow">
    <div style="font-size:18px;">This project uses cloud variables</div>
    <div id="usernameHint">Choose a username (letters, numbers, - and _, up to 20 characters).</div>
    <input type="text" id="usernameInput" placeholder="Enter a username" maxlength="20">
    <button id="usernameBtn">Continue</button>
  </div>
  <div class="spinner"></div>
  <div id="statusMsg"></div>
</div>

<div id="stage-container"></div>

<script>
  // Per TurboWarp Scaffolding's official docs: use trampoline for metadata
  // (Scratch API only allows scratch.mit.edu origins directly), then fetch
  // project data from projects.scratch.mit.edu using the returned token.
  const API_PROJECT_META = 'https://trampoline.turbowarp.org/api/projects/';
  const PROJECT_HOST = 'https://projects.scratch.mit.edu/';

  const overlay = document.getElementById('overlay');
  const statusMsg = document.getElementById('statusMsg');
  const stageContainer = document.getElementById('stage-container');

  let scaffolding = null;


  // ---- Cloud variables ----
  // Scratch's own cloud server (clouddata.scratch.mit.edu) rejects connections from
  // any origin other than scratch.mit.edu, so it can't be used from a self-hosted page.
  // TurboWarp's cloud server accepts any origin, so we use that instead. Note that
  // its data is separate from Scratch's: values set here are NOT shared with scratch.mit.edu.
  const CLOUD_SERVER = 'wss://clouddata.turbowarp.org';

  class CloudProvider {
    constructor(vm, username, projectId) {
      this.vm = vm;
      this.username = username;
      this.projectId = projectId;
      this.queue = [];
      this.ws = null;
      this.closed = false;
      this.attempts = 0;
      this.enable();
    }
    // TurboWarp's VM calls enable()/disable() on the provider
    enable() {
      this.closed = false;
      if (!this.ws || this.ws.readyState === WebSocket.CLOSED) this.connect();
    }
    disable() {
      this.closed = true;
      if (this.ws) this.ws.close();
    }
    connect() {
      if (this.closed) return;
      if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) return;
      this.ws = new WebSocket(CLOUD_SERVER);
      this.ws.onopen = () => {
        this.attempts = 0;
        this.send({ method: 'handshake' });
        const q = this.queue; this.queue = [];
        q.forEach(m => this.send(m));
      };
      this.ws.onmessage = (e) => {
        String(e.data).split('\n').filter(Boolean).forEach(line => {
          try {
            const msg = JSON.parse(line);
            if (msg.method === 'set') {
              this.vm.postIOData('cloud', { varUpdate: { name: msg.name, value: msg.value } });
            }
          } catch (err) { console.warn('Bad cloud message', err); }
        });
      };
      this.ws.onclose = () => {
        if (this.closed) return;
        const delay = Math.min(30000, 1000 * Math.pow(2, this.attempts++));
        setTimeout(() => this.connect(), delay);
      };
      this.ws.onerror = () => {};
    }
    send(msg) {
      msg.user = this.username;
      msg.project_id = String(this.projectId);
      if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(JSON.stringify(msg) + '\n');
      } else if (msg.method !== 'handshake') {
        this.queue.push(msg);
        if (this.queue.length > 500) this.queue.shift();
      }
    }
    updateVariable(name, value) { this.send({ method: 'set', name, value }); }
    createVariable(name, value) { this.send({ method: 'create', name, value }); }
    renameVariable(oldName, newName) { this.send({ method: 'rename', name: oldName, new_name: newName }); }
    deleteVariable(name) { this.send({ method: 'delete', name }); }
    requestCloseConnection() {
      this.disable();
    }
  }

  function getUsername() {
    const fromParam = new URLSearchParams(window.location.search).get('username');
    if (fromParam && /^[A-Za-z0-9_-]{1,20}$/.test(fromParam)) return fromParam;
    try {
      let saved = localStorage.getItem('scratchget_username');
      if (!saved) {
        saved = 'player' + Math.floor(Math.random() * 9000 + 1000);
        localStorage.setItem('scratchget_username', saved);
      }
      return saved;
    } catch (e) {
      return 'player' + Math.floor(Math.random() * 9000 + 1000);
    }
  }

  function askForUsername() {
    return new Promise((resolve) => {
      const row = document.getElementById('usernameRow');
      const input = document.getElementById('usernameInput');
      const btn = document.getElementById('usernameBtn');
      const hint = document.getElementById('usernameHint');
      input.value = getUsername();
      overlay.classList.add('asking');
      setStatus('');
      input.focus();
      input.select();

      function submit() {
        const name = input.value.trim();
        if (!/^[A-Za-z0-9_-]{1,20}$/.test(name)) {
          hint.textContent = 'Invalid username. Use 1-20 letters, numbers, - or _.';
          hint.style.color = '#ff6b6b';
          return;
        }
        try { localStorage.setItem('scratchget_username', name); } catch (e) {}
        btn.onclick = null;
        input.onkeydown = null;
        overlay.classList.remove('asking');
        resolve(name);
      }
      btn.onclick = submit;
      input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
    });
  }

  function getIdFromParams() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id') || params.get('project') || params.get('projectId');
  }

  function setStatus(msg) {
    statusMsg.textContent = msg;
  }

  async function fetchProjectData(id) {
    // Step 1: get project metadata (title + token) via trampoline, since
    // api.scratch.mit.edu only allows requests from scratch.mit.edu itself.
    setStatus('Fetching project metadata...');
    const metaRes = await fetch(API_PROJECT_META + id);
    if (metaRes.status === 404) {
      throw new Error('The project is unshared or does not exist.');
    }
    if (!metaRes.ok) {
      throw new Error('HTTP error ' + metaRes.status + ' fetching project metadata.');
    }
    const meta = await metaRes.json();
    const token = meta.project_token;

    // Step 2: fetch the actual project data using the token.
    setStatus('Downloading project file...');
    const tokenParam = token ? `?token=${token}` : '';
    const projRes = await fetch(`${PROJECT_HOST}${id}${tokenParam}`);
    if (!projRes.ok) {
      throw new Error('HTTP error ' + projRes.status + ' fetching project data.');
    }
    const projectData = await projRes.arrayBuffer();
    return { meta, projectData };
  }

  function initEngine() {
      if (typeof Scaffolding === 'undefined') {
        throw new Error('Scaffolding library failed to load from CDN.');
      }

      // Set up the self-hosted TurboWarp (Scaffolding) player
      scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 480;
      scaffolding.height = 360;
      scaffolding.resizeMode = 'preserve-ratio'; // keep correct aspect ratio, letterbox if needed
      
      // Initialize scaffolding first so scaffolding.renderer exists
      scaffolding.setup();

      // Enable High Quality Pen on the renderer instance
      if (scaffolding.renderer) {
        scaffolding.renderer.highQualityPen = true;
      }

      scaffolding.appendTo(stageContainer);

      // Tell scratch-storage where to download costumes/sounds from —
      // without this, Scaffolding can't resolve project assets.
      const storage = scaffolding.storage;
      storage.addWebStore(
        [storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound],
        (asset) => `https://assets.scratch.mit.edu/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
      );
  }

  async function loadProject(id) {
    if (!/^\d+$/.test(id)) {
      setStatus('Invalid project ID — must be numeric.');
      return;
    }

    try {
      // Start the download first, then boot the engine while it runs in the background
      const dataPromise = fetchProjectData(id);
      dataPromise.catch(() => {}); // avoid unhandled-rejection noise; error is handled below
      initEngine();
      const { meta, projectData } = await dataPromise;

      // (engine was already set up while the download was in flight)

      setStatus('Loading project into engine...');
      await scaffolding.loadProject(projectData);

      // Only connect to the cloud server if the project actually uses cloud variables
      if (scaffolding.vm.runtime.hasCloudData()) {
        const username = await askForUsername();
        scaffolding.setUsername(username);
        setStatus('Connecting to cloud variables...');
        scaffolding.addCloudProvider(new CloudProvider(scaffolding.vm, username, id));
      } else {
        scaffolding.setUsername(getUsername());
      }

      scaffolding.start();
      scaffolding.greenFlag();

      overlay.style.display = 'none';
      document.title = (meta.title || 'Scratch Project') + ' — Self-Hosted Player';

      window.addEventListener('resize', () => {
        if (scaffolding) {
          scaffolding.relayout();
        }
      });
    } catch (err) {
      overlay.classList.remove('loading-only');
      setStatus('Error: ' + err.message);
    }
  }

  function startFromInput() {
    const id = document.getElementById('projectIdInput').value.trim();
    loadProject(id);
  }

  const initialId = getIdFromParams();
  if (initialId) {
    overlay.classList.add('loading-only');
    document.getElementById('projectIdInput').value = initialId;
    loadProject(initialId);
  }
</script>

</body>
</html>
