<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyDraw</title>
<style>
  :root{
    --accent:#1ba1e2; --on-accent:#ffffff;
    --bg:#ffffff; --surface:#f0f0f0; --surface2:#dcdcdc; --line:#bdbdbd; --text:#111111; --dim:#6a6a6a;
    color-scheme: light;
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#1c1c1c; --surface2:#2d2d2d; --line:#404040; --text:#ffffff; --dim:#9b9b9b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1c1c1c; --surface2:#2d2d2d; --line:#404040; --text:#ffffff; --dim:#9b9b9b;
    color-scheme: dark;
  }
  *,*::before,*::after{box-sizing:inherit;}
  html,body{height:100%;margin:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    font-family:"Segoe UI","Selawik","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit;}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;}
  [hidden]{display:none !important;}
  .ic{display:inline-flex;align-items:center;justify-content:center;pointer-events:none;}
  .ic svg{display:block;}

  .screen{position:fixed;inset:0;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .screen.active{display:flex;flex-direction:column;}

  /* ---------- Metro controls ---------- */
  .m-btn{border:2px solid var(--text);padding:8px 22px;min-width:96px;font-size:16px;background:transparent;transition:background .1s;text-align:center;}
  .m-btn:hover{background:rgba(128,128,128,.22);}
  .m-btn:active{background:var(--text);color:var(--bg);}
  .m-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .m-btn.primary:hover{filter:brightness(1.1);}
  .m-btn.sm{padding:5px 14px;min-width:0;font-size:14px;}
  .m-btn.block{display:block;width:100%;}
  .m-field{background:var(--surface2);border:2px solid transparent;border-radius:0;padding:7px 9px;font-size:15px;width:100%;outline:none;color:var(--text);}
  .m-field:focus{border-color:var(--accent);}
  textarea.m-field{resize:vertical;min-height:72px;}
  select.m-field{padding:7px 6px;}
  .m-color{width:56px;height:36px;border:2px solid var(--line);padding:0;background:none;cursor:pointer;}
  .m-lbl{font-size:13px;color:var(--dim);margin:14px 0 6px;}
  .m-lbl:first-child{margin-top:0;}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:
      linear-gradient(var(--accent),var(--accent)) left center / var(--pct,0%) 4px no-repeat,
      linear-gradient(var(--surface2),var(--surface2)) left center / 100% 4px no-repeat;
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:28px;background:transparent;}
  input[type=range]::-moz-range-track{height:28px;background:transparent;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:28px;background:var(--text);border:0;border-radius:0;}
  input[type=range]::-moz-range-thumb{width:14px;height:28px;background:var(--text);border:0;border-radius:0;}
  input[type=range]:active::-webkit-slider-thumb{background:var(--accent);}
  input[type=range]:active::-moz-range-thumb{background:var(--accent);}
  input[type=range].hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
  input[type=range].hue::-webkit-slider-thumb{background:#fff;box-shadow:0 0 0 2px #000;}
  input[type=range].hue::-moz-range-thumb{background:#fff;box-shadow:0 0 0 2px #000;}

  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:15px;cursor:pointer;}
  .switch{position:relative;display:inline-block;flex:0 0 auto;}
  .switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
  .switch i{display:block;width:46px;height:22px;border:2px solid var(--text);position:relative;}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--text);transition:transform .12s;}
  .switch input:checked + i{background:var(--accent);border-color:var(--accent);}
  .switch input:checked + i::after{transform:translateX(24px);background:var(--on-accent);}
  .switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px;}

  .seg{display:flex;gap:2px;}
  .seg button{flex:1;padding:8px 6px;background:var(--surface2);font-size:14px;}
  .seg button.on{background:var(--accent);color:var(--on-accent);}

  .srow{margin:6px 0 10px;}
  .srow-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--dim);}
  .srow-h b{font-weight:400;color:var(--text);min-width:52px;text-align:right;font-size:15px;}

  /* ---------- Boot ---------- */
  #boot{background:var(--accent);color:var(--on-accent);justify-content:flex-end;padding-left:8vw;padding-right:8vw;}
  #boot .wrap{padding-bottom:14vh;}
  #boot h1{font-size:clamp(56px,15vw,132px);font-weight:200;margin:0;letter-spacing:-3px;line-height:1;}
  #boot .sub{font-size:20px;font-weight:300;margin:6px 4px 36px;opacity:.92;}
  #startBtn{border:2px solid currentColor;padding:12px 44px;font-size:20px;color:var(--on-accent);background:transparent;}
  #startBtn:hover{background:rgba(255,255,255,.18);}
  #startBtn:active{background:var(--on-accent);color:var(--accent);}

  /* ---------- Tutorial ---------- */
  #tutorial{background:#000;color:#fff;align-items:center;justify-content:center;gap:0;}
  #tutorial .player{width:min(960px,94vw);aspect-ratio:16/9;background:#000;position:relative;overflow:hidden;}
  #tutVideo,#tutCanvas{width:100%;height:100%;display:block;background:#000;}
  #tutCaption{position:absolute;left:0;right:0;bottom:0;padding:18px 24px;font-size:clamp(14px,2.4vw,22px);font-weight:300;background:linear-gradient(transparent,rgba(0,0,0,.85));}
  #tutorial .progress{width:min(960px,94vw);height:4px;background:#2a2a2a;margin-top:12px;}
  #tutorial .progress i{display:block;height:100%;width:0;background:var(--accent);}
  #skipTut{margin-top:20px;font-size:18px;font-weight:300;color:#fff;padding:8px 18px;border:2px solid #fff;}
  #skipTut:active{background:#fff;color:#000;}

  /* ---------- App bar ---------- */
  .appbar{display:flex;align-items:center;justify-content:center;gap:4px;min-height:62px;padding:6px 10px;background:var(--surface);border-top:1px solid var(--line);flex:0 0 auto;overflow-x:auto;}
  .ab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:2px 6px;font-size:11px;color:var(--text);flex:0 0 auto;}
  .ab .circ{width:38px;height:38px;border:2px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .ab:active .circ{background:var(--text);color:var(--bg);}
  .ab[disabled]{opacity:.35;pointer-events:none;}
  .ab-sp{flex:1;min-width:6px;}
  #panelBtn{display:none;}

  /* ---------- Gallery ---------- */
  #gallery .g-head{padding:26px 32px 4px;flex:0 0 auto;}
  .g-app{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--dim);}
  .g-title{font-size:clamp(40px,9vw,76px);font-weight:200;margin:0;letter-spacing:-2px;line-height:1.05;}
  .grid{flex:1;overflow:auto;padding:16px 32px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:min-content;gap:8px;align-content:start;}
  .tile{position:relative;aspect-ratio:1;background:var(--surface2);overflow:hidden;cursor:pointer;transform-origin:left center;
    animation:tileIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms);transition:transform .1s;outline:none;}
  .tile:active{transform:scale(.96);}
  .tile:focus-visible{box-shadow:inset 0 0 0 3px var(--text);}
  .tile.new{background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;}
  .tile .tlabel{position:absolute;left:10px;bottom:8px;font-size:14px;}
  .tile .thumbwrap{position:absolute;inset:0;background:repeating-conic-gradient(#bbb 0% 25%,#e6e6e6 0% 50%) 0 0/16px 16px;}
  .tile img{width:100%;height:100%;object-fit:contain;display:block;}
  .tile .tname{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:14px;background:rgba(0,0,0,.62);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .tx{position:absolute;top:0;right:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:opacity .12s;}
  .tile:hover .tx,.tile:focus-within .tx{opacity:1;}
  @media (hover:none){.tile .tx{opacity:1;}}
  @keyframes tileIn{from{opacity:0;transform:perspective(700px) rotateY(-70deg);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.tile{animation:none;}}

  /* ---------- Editor ---------- */
  #editor{background:var(--bg);}
  .e-top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex:0 0 auto;}
  .circ-btn{width:40px;height:40px;border:2px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .circ-btn:active{background:var(--text);color:var(--bg);}
  #drawingName{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text);font-size:28px;font-weight:200;padding:0 4px;outline:none;letter-spacing:-.5px;border-radius:0;}
  #drawingName:focus{border-bottom-color:var(--accent);}
  .status{font-size:12px;color:var(--dim);flex:0 0 auto;min-width:64px;text-align:right;}

  .e-main{flex:1;display:flex;min-height:0;position:relative;}
  #toolRail{flex:0 0 56px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;padding:0 2px 4px;}
  .tbtn{flex:0 0 52px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--text);background:var(--surface);position:relative;cursor:pointer;}
  .tbtn:hover{background:var(--surface2);}
  .tbtn.active{background:var(--accent);color:var(--on-accent);}
  .tbtn input[type=file]{display:none;}
  #railColor{margin-top:6px;}
  #railColor i{display:block;width:30px;height:30px;border:2px solid var(--text);background:#111;}

  #canvasWrap{flex:1;min-width:0;position:relative;overflow:auto;display:flex;padding:20px;background:var(--surface);}
  #sizer{margin:auto;position:relative;flex:0 0 auto;}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;isolation:isolate;touch-action:none;box-shadow:0 0 0 1px var(--line);}
  #stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;}
  #stage.pix canvas{image-rendering:pixelated;}
  #drawCursor{position:fixed;pointer-events:none;border:1.5px solid #fff;border-radius:50%;z-index:60;display:none;mix-blend-mode:difference;}

  #rightPanel{flex:0 0 330px;width:330px;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);min-height:0;}
  .pv-head{display:flex;gap:16px;padding:10px 16px 4px;flex:0 0 auto;overflow-x:auto;}
  .pv-head button{font-size:25px;font-weight:200;color:var(--dim);letter-spacing:-.5px;white-space:nowrap;}
  .pv-head button.on{color:var(--text);}
  .pv-body{flex:1;overflow-y:auto;padding:8px 16px 24px;}
  .opt-t{font-size:13px;color:var(--dim);margin:14px 0 6px;}
  .opt-t:first-child{margin-top:2px;}

  #brushPreview{width:100%;height:56px;display:block;background:var(--surface);margin-bottom:4px;}
  .bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .btile{background:var(--surface);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--dim);}
  .btile canvas{width:100%;height:26px;display:block;}
  .btile:hover{background:var(--surface2);}
  .btile.on{background:var(--accent);color:var(--on-accent);}

  #svWrap{position:relative;height:150px;touch-action:none;cursor:crosshair;}
  #svCanvas{width:100%;height:100%;display:block;}
  #svDot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;box-shadow:0 0 0 1px #000;border-radius:50%;pointer-events:none;}
  .hexrow{display:flex;align-items:center;gap:10px;margin:10px 0 2px;}
  .hexrow .m-field{width:110px;}
  .hexrow .rgbtxt{font-size:13px;color:var(--dim);}
  .pal{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;}
  .pal button{aspect-ratio:1;border:1px solid rgba(128,128,128,.4);}
  .pal button.on{outline:2px solid var(--text);outline-offset:1px;}

  #layerList{display:flex;flex-direction:column;gap:2px;max-height:230px;overflow-y:auto;}
  .lrow{display:flex;align-items:center;gap:8px;padding:5px 6px;background:var(--surface);cursor:pointer;}
  .lrow.on{background:var(--accent);color:var(--on-accent);}
  .lrow .lbtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .lthumb{width:40px;height:30px;flex:0 0 auto;background:repeating-conic-gradient(#bbb 0% 25%,#e6e6e6 0% 50%) 0 0/10px 10px;}
  .lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;}
  .lbar{display:flex;gap:4px;margin:10px 0 4px;}
  .lbar button{flex:1;height:38px;display:flex;align-items:center;justify-content:center;background:var(--surface);}
  .lbar button:hover{background:var(--surface2);}
  .lbar button:active{background:var(--text);color:var(--bg);}

  .size-row{display:flex;align-items:center;gap:8px;}
  .size-row input{flex:1;min-width:0;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
  .chips button{padding:5px 9px;font-size:12px;background:var(--surface2);}
  .chips button:hover{background:var(--accent);color:var(--on-accent);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;}

  @media (max-width:820px){
    #rightPanel{position:absolute;right:0;top:0;bottom:0;width:min(330px,92vw);flex:none;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:20;border-left:2px solid var(--accent);}
    #rightPanel.open{transform:none;}
    #panelBtn{display:flex;}
    .e-top{padding:8px 10px;gap:10px;}
    #drawingName{font-size:22px;}
    #gallery .g-head{padding:18px 18px 2px;}
    .grid{padding:12px 18px 20px;}
  }

  /* ---------- Dialogs & toasts ---------- */
  #dialogHost{position:fixed;inset:0;z-index:100;pointer-events:none;}
  .dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fadeIn .15s;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .dlg{width:100%;background:var(--surface);border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);max-height:92vh;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));}
  .dlg-in{max-width:560px;margin:0 auto;}
  .dlg-title{margin:0 0 12px;font-size:28px;font-weight:300;letter-spacing:-.5px;}
  .dlg-msg{margin:0 0 6px;font-size:16px;line-height:1.45;white-space:pre-line;}
  .dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}
  .dlg-btns .m-btn{flex:1;max-width:240px;}
  .dlg .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
  .dlg .swatches button{aspect-ratio:1.6;position:relative;}
  .dlg .swatches button.on::after{content:"";position:absolute;inset:4px;border:2px solid var(--on-accent);mix-blend-mode:difference;}
  .exp-prev{display:block;max-width:100%;max-height:200px;margin:0 auto 12px;background:repeating-conic-gradient(#bbb 0% 25%,#e6e6e6 0% 50%) 0 0/14px 14px;}
  #toastHost{position:fixed;left:0;right:0;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:120;pointer-events:none;}
  .toast{background:var(--accent);color:var(--on-accent);padding:10px 20px;font-size:15px;max-width:90vw;animation:toastIn .2s ease-out;}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot" class="screen active">
  <div class="wrap">
    <h1>MyDraw</h1>
    <div class="sub">draw anything, anywhere</div>
    <button id="startBtn">Start</button>
  </div>
</div>

<!-- TUTORIAL -->
<div id="tutorial" class="screen">
  <div class="player">
    <video id="tutVideo" playsinline preload="auto"></video>
    <canvas id="tutCanvas" width="960" height="540" style="display:none;"></canvas>
    <div id="tutCaption" style="display:none;"></div>
  </div>
  <div class="progress"><i id="tutProgress"></i></div>
  <button id="skipTut">skip ›</button>
</div>

<!-- GALLERY -->
<div id="gallery" class="screen">
  <div class="g-head">
    <h2 class="g-title">my drawings</h2>
  </div>
  <div class="grid" id="galleryGrid"></div>
  <div class="appbar">
    <button class="ab" id="replayTut"><span class="circ"><i class="ic" data-ic="play" data-s="20"></i></span><span>tutorial</span></button>
    <button class="ab" id="settingsBtn"><span class="circ"><i class="ic" data-ic="sliders" data-s="20"></i></span><span>settings</span></button>
  </div>
</div>

<!-- EDITOR -->
<div id="editor" class="screen">
  <div class="e-top">
    <button class="circ-btn" id="backBtn" title="Back to gallery"><i class="ic" data-ic="back" data-s="20"></i></button>
    <input id="drawingName" value="untitled" maxlength="60" spellcheck="false" aria-label="Drawing name">
    <span class="status" id="saveStatus"></span>
  </div>
  <div class="e-main">
    <div id="toolRail">
      <button class="tbtn active" data-tool="brush" title="Brush (B)"><i class="ic" data-ic="brush"></i></button>
      <button class="tbtn" data-tool="eraser" title="Eraser (E)"><i class="ic" data-ic="eraser"></i></button>
      <button class="tbtn" data-tool="bucket" title="Bucket fill (G)"><i class="ic" data-ic="bucket"></i></button>
      <button class="tbtn" data-tool="eyedropper" title="Eyedropper (I)"><i class="ic" data-ic="eyedropper"></i></button>
      <button class="tbtn" data-tool="text" title="Text (T)"><i class="ic" data-ic="text"></i></button>
      <button class="tbtn" data-tool="line" title="Line (L)"><i class="ic" data-ic="line"></i></button>
      <button class="tbtn" data-tool="rect" title="Rectangle (R)"><i class="ic" data-ic="rect"></i></button>
      <button class="tbtn" data-tool="ellipse" title="Ellipse (O)"><i class="ic" data-ic="ellipse"></i></button>
      <button class="tbtn" data-tool="triangle" title="Triangle"><i class="ic" data-ic="triangle"></i></button>
      <button class="tbtn" data-tool="move" title="Move layer (V)"><i class="ic" data-ic="move"></i></button>
      <label class="tbtn" title="Import image"><i class="ic" data-ic="image"></i><input type="file" id="imgImport" accept="image/*"></label>
      <button class="tbtn" id="railColor" title="Color"><i id="railColorDot"></i></button>
    </div>

    <div id="canvasWrap">
      <div id="sizer"><div id="stage"></div></div>
    </div>

    <div id="rightPanel">
      <div class="pv-head">
        <button class="on" data-pivot="brush">brush</button>
        <button data-pivot="color">color</button>
        <button data-pivot="layers">layers</button>
        <button data-pivot="canvas">canvas</button>
      </div>
      <div class="pv-body">

        <section data-pv="brush">
          <canvas id="brushPreview" width="600" height="112"></canvas>
          <div data-tools="brush">
            <div class="opt-t">brushes</div>
            <div class="bgrid" id="brushGrid"></div>
          </div>
          <div class="srow"><div class="srow-h"><span id="sizeLbl">size</span><b id="sizeVal">10</b></div><input type="range" id="sizeRange" min="1" max="200" value="10"></div>
          <div class="srow"><div class="srow-h"><span>opacity</span><b id="opVal">100</b></div><input type="range" id="opacityRange" min="1" max="100" value="100"></div>
          <div class="srow" data-tools="brush eraser"><div class="srow-h"><span>stabilizer</span><b id="smVal">0</b></div><input type="range" id="smoothRange" min="0" max="90" value="0"></div>
          <label class="switch-row" data-tools="rect ellipse triangle"><span>filled shapes</span><span class="switch"><input type="checkbox" id="fillShape"><i></i></span></label>
          <div class="srow" data-tools="bucket"><div class="srow-h"><span>tolerance</span><b id="tolVal">48</b></div><input type="range" id="tolRange" min="0" max="200" value="48"></div>
          <label class="switch-row" data-tools="bucket"><span>sample all layers</span><span class="switch"><input type="checkbox" id="bucketAll" checked><i></i></span></label>
        </section>

        <section data-pv="color" hidden>
          <div id="svWrap"><canvas id="svCanvas" width="300" height="150"></canvas><div id="svDot"></div></div>
          <div style="margin-top:8px;"><input type="range" class="hue" id="hueRange" min="0" max="360" value="0"></div>

/* ---- Icons (thin, square Metro-style line glyphs) ---- */

function icon(name, size, sw){
  size = size || 22; sw = sw || 1.8;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="' + sw +
    '" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}
function hydrateIcons(root){

/* ---- Color utilities ---- */
function normHex(h){
  if(typeof h !== 'string') return null;
  h = h.trim().replace(/^#/, '');
  if(/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c => c + c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return '#' + h.toLowerCase();
}
function hexToRgb(hex){
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(r, g, b){
  return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function hsvToRgb(h, s, v){
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if(h < 60){ r = c; g = x; }
  else if(h < 120){ r = x; g = c; }
  else if(h < 180){ g = c; b = x; }
  else if(h < 240){ g = x; b = c; }
  else if(h < 300){ r = x; b = c; }
  else { r = c; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHsv(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if(d){
    if(mx === r) h = ((g - b) / d) % 6;
    else if(mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if(h < 0) h += 360;
  }
  return {h:h, s: mx ? d / mx : 0, v: mx};
}
function rgba(hex, a){
  const c = hexToRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function luminance(hex){
  const c = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

/* =====================================================================

const SETTINGS_KEY = 'mydraw_settings_v2';
const SEEN_TUT_KEY = 'mydraw_seen_tutorial_v1';
const OLD_DB_KEY = 'mydraw_drawings_v1';
const TUTORIAL_VIDEO = 'tutorial.mp4';   // <- file path of the intro video

const ACCENTS = [

  const a = normHex(settings.accent) || '#1ba1e2';

/* =====================================================================
   Toasts & dialogs (in-page; the browser prompt/confirm/alert are not
   reliable inside an embedded page)
   ===================================================================== */
function toast(msg, ms){
  const t = el('div', 'toast', msg);
  $('toastHost').appendChild(t);
  setTimeout(() => t.remove(), ms || 2200);
}

function openDialog(opts){
  return new Promise(resolve => {
    const host = $('dialogHost');
    const back = el('div', 'dlg-back');
    const box = el('div', 'dlg');
    const inner = el('div', 'dlg-in');
    inner.appendChild(el('h3', 'dlg-title', opts.title || ''));
    if(opts.message) inner.appendChild(el('p', 'dlg-msg', opts.message));
    if(opts.content) inner.appendChild(opts.content);
    const row = el('div', 'dlg-btns');
    let primaryBtn = null;
    (opts.buttons || [{label:'ok', value:true, primary:true}]).forEach(b => {
      const bt = el('button', 'm-btn' + (b.primary ? ' primary' : ''), b.label);
      bt.addEventListener('click', () => close(b.value));
      if(b.primary) primaryBtn = bt;
      row.appendChild(bt);
    });
    inner.appendChild(row);
    box.appendChild(inner);
    back.appendChild(box);
    host.appendChild(back);
    const prevFocus = document.activeElement;
    const cancelValue = opts.cancelValue === undefined ? null : opts.cancelValue;
    function close(v){
      document.removeEventListener('keydown', onKey, true);
      back.remove();
      if(prevFocus && prevFocus.focus){ try{ prevFocus.focus(); }catch(e){} }
      resolve(v);
    }
    function onKey(e){
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(cancelValue); }
      else if(e.key === 'Enter' && primaryBtn && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON'){
        e.preventDefault(); primaryBtn.click();
      }
    }
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('pointerdown', e => { if(e.target === back) close(cancelValue); });
    const first = inner.querySelector('input[type=text],textarea') || primaryBtn;
    if(first){ setTimeout(() => { try{ first.focus(); if(first.select && first.tagName === 'INPUT') first.select(); }catch(e){} }, 30); }
  });
}
function confirmDlg(title, message, okLabel){
  return openDialog({title:title, message:message, cancelValue:false,
    buttons:[{label:'cancel', value:false}, {label:okLabel || 'ok', value:true, primary:true}]});
}
function alertDlg(title, message){
  return openDialog({title:title, message:message, buttons:[{label:'ok', value:true, primary:true}]});
}
async function promptDlg(title, initial, okLabel){
  const inp = el('input', 'm-field');
  inp.type = 'text'; inp.value = initial || ''; inp.maxLength = 60;
  const r = await openDialog({title:title, content:inp, cancelValue:false,
    buttons:[{label:'cancel', value:false}, {label:okLabel || 'ok', value:true, primary:true}]});
  return r ? inp.value : null;
}
function makeSwitch(labelText, checked){
  const row = el('label', 'switch-row');
  row.appendChild(el('span', '', labelText));

  sw.appendChild(input); sw.appendChild(el('i'));
  row.appendChild(sw);
  return {row:row, input:input};
}

/* =====================================================================
   Storage (IndexedDB — layers are stored as PNG blobs, no 5 MB cap)
   ===================================================================== */
const DB_NAME = 'mydraw', STORE = 'drawings';
let idb = null;
let drawings = [];

function openIDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore(STORE, {keyPath:'id'}); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    }catch(e){ res(null); }
  });
}
function idbAll(){
  return new Promise(res => {
    if(!idb) return res([]);
    try{
      const rq = idb.transaction(STORE, 'readonly').objectStore(STORE).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    }catch(e){ res([]); }
  });
}
function idbPut(d){
  return new Promise(res => {
    if(!idb) return res(false);
    try{
      const tx = idb.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(d);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
      tx.onabort = () => res(false);
    }catch(e){ res(false); }
  });
}
function idbDel(id){
  return new Promise(res => {
    if(!idb) return res(false);
    try{
      const tx = idb.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
      tx.onabort = () => res(false);
    }catch(e){ res(false); }
  });
}
function dataURLToBlob(u){
  try{
    const i = u.indexOf(',');
    const mime = (u.slice(5, i).split(';')[0]) || 'image/png';
    const bin = atob(u.slice(i + 1));
    const arr = new Uint8Array(bin.length);
    for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], {type:mime});
  }catch(e){ return null; }
}
async function initStorage(){
  idb = await openIDB();
  drawings = await idbAll();
  // One-time migration of drawings saved by the first version (localStorage, data URLs)
  try{
    const raw = localStorage.getItem(OLD_DB_KEY);
    if(raw){
      const old = JSON.parse(raw) || [];
      const have = new Set(drawings.map(d => d.id));
      let allSaved = true;
      for(const o of old){
        if(!o || !o.id || have.has(o.id)) continue;
        const rec = {
          id:o.id, name:o.name || 'untitled', width:o.width || 1000, height:o.height || 700,
          bg:(o.bg === undefined ? '#ffffff' : o.bg), created:Date.now(), updated:Date.now(), thumb:o.thumb || null,
          layers:(o.layers || []).map(l => ({id:l.id || uid(), name:l.name || 'layer', visible:l.visible !== false,
            opacity:1, blend:'normal', blob:l.data ? dataURLToBlob(l.data) : null}))
        };
        const ok = await idbPut(rec);
        if(!ok) allSaved = false;
        drawings.push(rec);
      }
      if(allSaved && idb) localStorage.removeItem(OLD_DB_KEY);
    }
  }catch(e){}
}
const ready = initStorage().catch(() => {});

  if(tutSession){ tutSession.stop(); tutSession = null; }
  showScreen('tutorial');
  tutProgress.style.width = '0%';
  tutCanvas.style.display = 'none'; tutCaption.style.display = 'none';
  tutVideo.style.display = 'block';

  let fellBack = false, raf = 0, watchdog = 0;
  const onTime = () => { if(tutVideo.duration) tutProgress.style.width = (tutVideo.currentTime / tutVideo.duration * 100) + '%'; };
  const onEnded = () => endTutorial();
  const onErr = () => fallback();
  const onPlaying = () => clearTimeout(watchdog);
  function detachVideo(){
    tutVideo.removeEventListener('timeupdate', onTime);
    tutVideo.removeEventListener('ended', onEnded);
    tutVideo.removeEventListener('error', onErr);
    tutVideo.removeEventListener('playing', onPlaying);
    try{ tutVideo.pause(); tutVideo.removeAttribute('src'); tutVideo.load(); }catch(e){}
  }
  const sess = {
    done:done,
    stop(){ cancelAnimationFrame(raf); clearTimeout(watchdog); detachVideo(); }
  };
  tutSession = sess;

  function fallback(){
    if(fellBack || tutSession !== sess) return;
    fellBack = true;
    clearTimeout(watchdog);
    detachVideo();
    tutVideo.style.display = 'none'; tutCanvas.style.display = 'block'; tutCaption.style.display = 'block';
    const ac = accentNow();
    let idx = 0, start = performance.now();
    const dur = 2800;
    const frame = now => {
      if(tutSession !== sess) return;
      const p = clamp((now - start) / dur, 0, 1), s = tutSlides[idx];
      tctx.clearRect(0,0,960,540);
      tctx.save(); try{ s.draw(tctx, p, ac); }catch(e){} tctx.restore();
      tutCaption.textContent = s.t;
      tutProgress.style.width = ((idx + p) / tutSlides.length * 100) + '%';
      if(p >= 1){
        idx++; start = now;
        if(idx >= tutSlides.length){ endTutorial(); return; }
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  tutVideo.addEventListener('timeupdate', onTime);
  tutVideo.addEventListener('ended', onEnded);
  tutVideo.addEventListener('error', onErr);
  tutVideo.addEventListener('playing', onPlaying);
  watchdog = setTimeout(fallback, 6000);
  tutVideo.src = TUTORIAL_VIDEO;
  try{
    tutVideo.load();
    const pr = tutVideo.play();
    if(pr && pr.catch) pr.catch(() => fallback());
  }catch(e){ fallback(); }
}

   ===================================================================== */
function rnd(a, b){ return a + Math.random() * (b - a); }
const BRUSHES = {
  round:{label:'round', sp:0.1, dab(g,x,y,s,c){ g.fillStyle = c; g.beginPath(); g.arc(x,y,s/2,0,TAU); g.fill(); }},
  square:{label:'square', sp:0.15, dab(g,x,y,s,c){ g.fillStyle = c; g.fillRect(x-s/2,y-s/2,s,s); }},
  soft:{label:'soft', sp:0.12, dab(g,x,y,s,c){
    const r = s/2, gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, rgba(c,0.55)); gr.addColorStop(1, rgba(c,0));
    g.fillStyle = gr; g.fillRect(x-r,y-r,s,s);
  }},
  spray:{label:'spray', sp:0.2, dab(g,x,y,s,c){
    g.fillStyle = c; const n = Math.ceil(s*0.9) + 4, d = Math.max(1, s/45);
    for(let i=0;i<n;i++){ const a = Math.random()*TAU, r = Math.sqrt(Math.random())*s/2; g.fillRect(x+Math.cos(a)*r, y+Math.sin(a)*r, d, d); }
  }},
  calligraphy:{label:'callig.', sp:0.06, dab(g,x,y,s,c){
    g.save(); g.translate(x,y); g.rotate(-Math.PI/4); g.fillStyle = c; g.fillRect(-s/2,-s/9,s,s/4.5); g.restore();
  }},
  pencil:{label:'pencil', sp:0.07, dab(g,x,y,s,c){
    g.fillStyle = c; const n = Math.ceil(s*0.7) + 3;
    for(let i=0;i<n;i++){
      const a = Math.random()*TAU, r = Math.sqrt(Math.random())*s*0.3;
      g.globalAlpha = rnd(0.35,1); g.beginPath(); g.arc(x+Math.cos(a)*r, y+Math.sin(a)*r, rnd(0.4,0.9), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }},
  marker:{label:'marker', sp:0.08, dab(g,x,y,s,c){
    g.fillStyle = c; g.fillRect(x-s/2, y-s*0.2, s, s*0.4);
  }},
  crayon:{label:'crayon', sp:0.15, dab(g,x,y,s,c){
    g.fillStyle = c; const n = Math.ceil(s*1.3) + 6;
    for(let i=0;i<n;i++){
      const a = Math.random()*TAU, r = Math.sqrt(Math.random())*s/2, d = rnd(1,3);
      g.globalAlpha = rnd(0.4,1); g.fillRect(x+Math.cos(a)*r, y+Math.sin(a)*r, d, d);
    }
    g.globalAlpha = 1;
  }},
  charcoal:{label:'charcoal', sp:0.18, dab(g,x,y,s,c){
    g.fillStyle = c; const n = Math.ceil(s*2) + 8;
    for(let i=0;i<n;i++){
      const px = x + (Math.random()+Math.random()+Math.random()-1.5) * s * 0.55;
      const py = y + (Math.random()+Math.random()+Math.random()-1.5) * s * 0.55;
      g.globalAlpha = rnd(0.15,0.8); g.fillRect(px, py, rnd(0.8,2.4), rnd(0.8,2.4));
    }
    g.globalAlpha = 1;
  }},
  rainbow:{label:'rainbow', sp:0.1, dab(g,x,y,s,c,w){
    w.hue = (w.hue + 3) % 360;
    g.fillStyle = 'hsl(' + w.hue + ',90%,55%)'; g.beginPath(); g.arc(x,y,s/2,0,TAU); g.fill();
  }},
  neon:{label:'neon', sp:0.16, dab(g,x,y,s,c){
    g.save(); g.shadowColor = c; g.shadowBlur = s*0.9;
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x,y,Math.max(0.8,s*0.2),0,TAU); g.fill();
    g.fillStyle = c; g.globalAlpha = 0.65; g.beginPath(); g.arc(x,y,Math.max(0.8,s*0.28),0,TAU); g.fill();
    g.restore();
  }},
  stars:{label:'stars', sp:0.9, dab(g,x,y,s,c){
    g.save(); g.translate(x,y); g.rotate(rnd(0,TAU)); g.fillStyle = c; g.beginPath();
    for(let i=0;i<10;i++){ const r = i%2 ? s*0.22 : s*0.5, a = i*Math.PI/5 - Math.PI/2; g.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
    g.closePath(); g.fill(); g.restore();
  }},
  confetti:{label:'confetti', sp:0.55, dab(g,x,y,s,c){
    for(let i=0;i<3;i++){
      g.fillStyle = 'hsl(' + Math.floor(rnd(0,360)) + ',85%,55%)'; g.beginPath();
      g.arc(x+rnd(-s*0.5,s*0.5), y+rnd(-s*0.5,s*0.5), Math.max(1,s*rnd(0.08,0.2)), 0, TAU); g.fill();
    }
  }},
  hatch:{label:'hatch', sp:0.22, dab(g,x,y,s,c){
    g.strokeStyle = c; g.lineWidth = Math.max(1, s*0.07); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x-s*0.35, y+s*0.35); g.lineTo(x+s*0.35, y-s*0.35); g.stroke();
  }},
  wash:{label:'wash', sp:0.2, dab(g,x,y,s,c){
    const r = s*0.75*rnd(0.8,1.15), gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, rgba(c,0.14)); gr.addColorStop(0.7, rgba(c,0.08)); gr.addColorStop(1, rgba(c,0));
    g.fillStyle = gr; g.fillRect(x-r,y-r,r*2,r*2);
  }}
};
const BRUSH_ORDER = ['round','square','soft','spray','calligraphy','pencil','marker','crayon','charcoal','rainbow','neon','stars','confetti','hatch','wash'];

class Walker{
  constructor(g, key, size, col){
    this.g = g; this.def = BRUSHES[key] || BRUSHES.round; this.s = size; this.c = col;
    this.hue = Math.random() * 360; this.last = null; this.left = 0;
  }
  sp(){ return Math.max(0.7, this.s * this.def.sp); }
  dab(x, y){ this.def.dab(this.g, x, y, this.s, this.c, this); }
  begin(p){ this.last = p; this.dab(p.x, p.y); this.left = this.sp(); }
  to(p){
    const a = this.last, dx = p.x - a.x, dy = p.y - a.y, len = Math.hypot(dx, dy);
    if(len > 0){
      const sp = this.sp(); let pos = this.left;
      while(pos <= len){ const t = pos / len; this.dab(a.x + dx*t, a.y + dy*t); pos += sp; }
      this.left = pos - len;
    }
    this.last = p;
  }
}
function drawSample(cv, key, size, col, alpha){
  const g = cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
  const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height;
  const w = new Walker(t.getContext('2d'), key, size, col), n = 48;
  for(let i=0;i<=n;i++){
    const u = i / n, p = {x:cv.width*(0.07 + 0.86*u), y:cv.height*(0.5 + 0.26*Math.sin(u*TAU))};
    if(i === 0) w.begin(p); else w.to(p);
  }
  g.globalAlpha = alpha; g.drawImage(t, 0, 0);
}

function flatten(w, h, withBg, forceBg){
  const c = document.createElement('canvas'); c.width = w; c.height = h;

  const fill = withBg ? (bg || forceBg || null) : null;

/* =====================================================================
   Undo / redo (per-layer pixel snapshots held as canvases)
   ===================================================================== */
function snap(l){ const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(l.canvas, 0, 0); return c; }
function maxUndo(){ return clamp(Math.floor(160e6 / (W * H * 4)), 6, 40); }
function pushUndo(l){
  const s = snap(l); undoStack.push({id:l.id, c:s});
  while(undoStack.length > maxUndo()) undoStack.shift();

}
function restore(l, c){ l.ctx.save(); l.ctx.globalCompositeOperation = 'copy'; l.ctx.drawImage(c, 0, 0); l.ctx.restore(); }
function doUndo(){
  let e;
  while((e = undoStack.pop())){
    const l = layers.find(x => x.id === e.id); if(!l) continue;
    redoStack.push({id:l.id, c:snap(l)}); restore(l, e.c); break;
  }
  updateUndoUI(); refreshThumbs(); markDirty();
}
function doRedo(){

function onDown(e){

    case 'bucket': doBucket(layer, p); return;
    case 'text': doText(layer, p); return;
    case 'brush': case 'eraser': startStroke(layer, p); return;
    case 'line': case 'rect': case 'ellipse': case 'triangle':
      act = {type:'shape', layer:layer, base:pushUndo(layer), start:p, cur:p, moved:false, shift:false}; return;
    case 'move':

}

function startStroke(layer, p){
  const base = pushUndo(layer);

}

/* ---- bucket fill (scanline, tolerance, optional all-layer sampling) ---- */
function doBucket(layer, p){
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if(x < 0 || y < 0 || x >= W || y >= H) return;
  const srcC = bucketAll ? flatten(W, H, false) : layer.canvas;
  const sd = srcC.getContext('2d').getImageData(0, 0, W, H).data;
  const i0 = (y * W + x) * 4, tr = sd[i0], tg = sd[i0+1], tb = sd[i0+2], ta = sd[i0+3], tol = bucketTol;
  const match = q => { const i = q * 4;
    return Math.abs(sd[i]-tr) <= tol && Math.abs(sd[i+1]-tg) <= tol && Math.abs(sd[i+2]-tb) <= tol && Math.abs(sd[i+3]-ta) <= tol; };
  const mask = new Uint8Array(W * H), stack = [y * W + x];
  while(stack.length){
    const q = stack.pop();
    if(mask[q] || !match(q)) continue;
    const yy = (q / W) | 0, row = yy * W, xx = q - row;
    let l = xx, r = xx;
    while(l > 0 && !mask[row + l - 1] && match(row + l - 1)) l--;
    while(r < W - 1 && !mask[row + r + 1] && match(row + r + 1)) r++;
    for(let k = l; k <= r; k++) mask[row + k] = 1;
    for(let d = -1; d <= 1; d += 2){
      const ny = yy + d; if(ny < 0 || ny >= H) continue;
      let inSpan = false;
      for(let k = l; k <= r; k++){
        const nq = ny * W + k, ok = !mask[nq] && match(nq);
        if(ok && !inSpan){ stack.push(nq); inSpan = true; } else if(!ok) inSpan = false;
      }
    }
  }
  pushUndo(layer);
  const rgb = hexToRgb(color), out = new ImageData(W, H), od = out.data;
  for(let k = 0; k < mask.length; k++){ if(mask[k]){ const o = k * 4; od[o] = rgb[0]; od[o+1] = rgb[1]; od[o+2] = rgb[2]; od[o+3] = 255; } }
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; tmp.getContext('2d').putImageData(out, 0, 0);
  layer.ctx.save(); layer.ctx.globalAlpha = brushOpacity; layer.ctx.drawImage(tmp, 0, 0); layer.ctx.restore();
  addRecent(color); afterEdit();
}

  layers.forEach((l, i) => {
    l.canvas.width = W; l.canvas.height = H;
    l.ctx.clearRect(0, 0, W, H); l.ctx.imageSmoothingQuality = 'high';
    if(scale) l.ctx.drawImage(snaps[i], 0, 0, W, H); else l.ctx.drawImage(snaps[i], 0, 0);
  });
  bufC.width = W; bufC.height = H;
  undoStack = []; redoStack = []; updateUndoUI();
  fit(); refreshThumbs(); markDirty();
  toast('Canvas resized. Undo history was cleared.');
});
function applyBg(){
  $('bgTransparent').checked = !bg;
  if(bg) $('bgInput').value = bg;
  stage.style.background = bg || 'repeating-conic-gradient(#bbb 0% 25%,#e6e6e6 0% 50%) 0 0/16px 16px';
}
$('bgInput').addEventListener('input', e => { bg = e.target.value; applyBg(); markDirty(); });
$('bgTransparent').addEventListener('change', e => { bg = e.target.checked ? null : ($('bgInput').value || '#ffffff'); applyBg(); markDirty(); });

/* =====================================================================
   Export (uses the host’s save prompt when running as a published page)
   ===================================================================== */
async function getDownloads(){
  try{ if(window.claude && window.claude.use) return await window.claude.use('downloads'); }catch(e){}
  return null;
}
function downloadViaAnchor(blob, filename){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
$('exportBtn').addEventListener('click', async () => {
  if(!editorReady) return;
  const wrapEl = el('div');
  const prev = el('img', 'exp-prev'); prev.alt = 'Preview';
  const mini = flatten(Math.max(1, Math.round(W * Math.min(1, 360 / Math.max(W, H)))), Math.max(1, Math.round(H * Math.min(1, 360 / Math.max(W, H)))), true);
  prev.src = mini.toDataURL('image/png');
  wrapEl.appendChild(prev);
  wrapEl.appendChild(el('div', 'm-lbl', 'format'));
  let fmt = 'png';
  const seg = el('div', 'seg');
  [['png', 'PNG (keeps transparency)'], ['jpg', 'JPG (smaller file)']].forEach(f => {
    const b = el('button', f[0] === fmt ? 'on' : '', f[1]);
    b.addEventListener('click', () => { fmt = f[0]; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
    seg.appendChild(b);
  });
  wrapEl.appendChild(seg);
  wrapEl.appendChild(el('div', 'm-lbl', W + ' × ' + H + ' px'));
  const ok = await openDialog({title:'export', content:wrapEl, cancelValue:false,
    buttons:[{label:'cancel', value:false}, {label:'export', value:true, primary:true}]});
  if(!ok) return;
  await saveNow();
  const mime = fmt === 'jpg' ? 'image/jpeg' : 'image/png';
  const flat = flatten(W, H, true, fmt === 'jpg' ? '#ffffff' : null);
  const blob = await canvasToBlob(flat, mime, 0.92);
  const base = (nameInput.value.trim() || 'drawing').replace(/[^\w\- ]+/g, '').trim() || 'drawing';
  const filename = base + '.' + fmt;
  if(!blob){ toast('Export failed.'); return; }
  if(!window.claude){ downloadViaAnchor(blob, filename); toast('Exported ' + filename); return; }
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename:filename, data:blob}); toast('Exported ' + filename); return; }
    catch(err){ if(err && err.code === 'declined'){ toast('Export cancelled.'); return; } }
  }
  // Fallback: show the image so it can be saved manually
  const w2 = el('div'); const im = el('img', 'exp-prev'); im.alt = filename; im.style.maxHeight = '50vh';
  im.src = flat.toDataURL(mime, 0.92); w2.appendChild(im);
  w2.appendChild(el('p', 'dlg-msg', 'Press and hold the image (or right-click it) to save it.'));
  await openDialog({title:'save your image', content:w2, buttons:[{label:'done', value:true, primary:true}]});
});

/* =====================================================================
   Open / close the editor
   ===================================================================== */
async function openDrawing(id){
  const d = drawings.find(x => x.id === id); if(!d) return;
  const token = ++openToken;
  current = d; editorReady = false; dirty = false; clearTimeout(saveTimer);
  W = d.width || 1000; H = d.height || 700;
  bg = d.bg === undefined ? '#ffffff' : d.bg;
  nameInput.value = d.name || 'untitled'; setStatus('loading…');
  $('wInput').value = W; $('hInput').value = H; applyBg();
  stage.textContent = ''; layers = []; undoStack = []; redoStack = []; updateUndoUI(); act = null;
  showScreen('editor');
  const metas = (d.layers && d.layers.length) ? d.layers : [{id:uid(), name:'layer 1', visible:true}];
  for(const m of metas){
    const l = makeLayer(m); layers.push(l); stage.appendChild(l.canvas);
    if(m.blob){
      try{ const bmp = await loadBitmap(m.blob); l.ctx.drawImage(bmp, 0, 0); if(bmp.close) bmp.close(); }catch(e){}
    }
    if(token !== openToken) return;
  }
  activeIdx = layers.length - 1;
  bufC.width = W; bufC.height = H;
  renderLayers(); syncLayerProps();
  editorReady = true; setStatus('');
  autoFit = true;
  requestAnimationFrame(() => { fit(); });
}
$('backBtn').addEventListener('click', async () => {
  if(editorReady){ clearTimeout(saveTimer); if(dirty) setStatus('saving…'); await saveNow(); }
  openToken++; editorReady = false; openGallery();
});

/* =====================================================================
   Keyboard shortcuts
   ===================================================================== */
document.addEventListener('keydown', e => {
  if(!screens.editor.classList.contains('active') || !editorReady) return;
  if($('dialogHost').children.length) return;
  const t = e.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if(mod){
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
    else if(k === 'y'){ e.preventDefault(); doRedo(); }
    else if(k === 's'){ e.preventDefault(); dirty = true; saveNow(); toast('Saved'); }
    return;
  }
  const map = {b:'brush', e:'eraser', g:'bucket', i:'eyedropper', t:'text', l:'line', r:'rect', o:'ellipse', v:'move'};
  if(map[k]){ setTool(map[k]); }
  else if(k === '['){ setSize(brushSize - (brushSize > 20 ? 5 : 1)); }
  else if(k === ']'){ setSize(brushSize + (brushSize >= 20 ? 5 : 1)); }
});

/* =====================================================================
   Init
   ===================================================================== */
setTool('brush');
setColor('#111111');
renderRecents();
setPivot('brush');
updateUndoUI();

})();
</script>
